# Baut Formelfreund auf einem Mac-Server von GitHub und führt die Tests aus.
#
# Nach jedem erfolgreichen Build auf "main" wird die App als Release "latest"
# veröffentlicht. Installieren auf dem Mac mit einer Zeile im Terminal:
#   curl -fsSL https://github.com/<besitzer>/<repo>/releases/download/latest/install.sh | sh
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# Nur ein Lauf pro Branch gleichzeitig; ein neuer Push bricht den alten ab.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: write   # zum Veröffentlichen des Releases
    steps:
      - uses: actions/checkout@v4

      - name: Xcode auswählen
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Verwende $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Logik testen (LaTeXKit)
        run: swift test --package-path Packages/LaTeXKit

      - name: App bauen
        run: |
          set -o pipefail
          xcodebuild \
            -project Formelfreund.xcodeproj \
            -scheme Formelfreund \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build \
            build 2>&1 | tee xcodebuild.log | grep -E "(error|warning):|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log

      - name: App verpacken
        run: |
          ditto -c -k --keepParent build/Build/Products/Release/Formelfreund.app Formelfreund.zip
          # Nur die Zeile REPO=… anpassen, die Prüfung auf den Platzhalter bleibt unverändert.
          sed "/^REPO=/s|__GITHUB_REPOSITORY__|${{ github.repository }}|" Scripts/install.sh > install.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Formelfreund
          path: Formelfreund.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log
          path: xcodebuild.log

      - name: Als "latest" veröffentlichen
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Formelfreund.zip install.sh \
            --target "$GITHUB_SHA" \
            --title "Formelfreund (neueste Version)" \
            --notes "Automatisch gebaut aus $(git rev-parse --short HEAD).

          Installieren: Terminal öffnen und eingeben:
          \`curl -fsSL https://github.com/${{ github.repository }}/releases/download/latest/install.sh | sh\`"
