# Baut Lemma auf einem Mac-Server von GitHub und führt die Tests aus.
#
# Nach jedem erfolgreichen Build auf "main" wird die App als Release "latest"
# veröffentlicht. Installieren auf dem Mac mit einer Zeile im Terminal:
#   curl -fsSL https://github.com/<besitzer>/<repo>/releases/download/latest/install.sh | sh
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# Nur ein Lauf pro Branch gleichzeitig; ein neuer Push bricht den alten ab.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: write   # zum Veröffentlichen des Releases
    steps:
      - uses: actions/checkout@v4

      - name: Xcode auswählen
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Verwende $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Logik testen (LaTeXKit)
        run: |
          set -o pipefail
          swift test --package-path Packages/LaTeXKit 2>&1 | tee test.log

      - name: App bauen
        run: |
          set -o pipefail
          xcodebuild \
            -project Lemma.xcodeproj \
            -scheme Lemma \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build \
            build 2>&1 | tee xcodebuild.log | grep -E "(error|warning):|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log

      - name: App verpacken
        run: |
          ditto -c -k --keepParent build/Build/Products/Release/Lemma.app Lemma.zip
          # Nur die Zeile REPO=… anpassen, die Prüfung auf den Platzhalter bleibt unverändert.
          sed "/^REPO=/s|__GITHUB_REPOSITORY__|${{ github.repository }}|" Scripts/install.sh > install.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Lemma
          path: Lemma.zip

      # Startet die fertige App, öffnet ein Testdokument und klickt schnell
      # Vorschau, Inspektor und Kompilieren durch (siehe Lemma/App/SelfTest.swift).
      # Kompiliert dabei echt mit Tectonic. Stürzt die App ab, schlägt der
      # Schritt fehl und es wird kein neues "latest" veröffentlicht.
      - name: Selbsttest (App starten, schnell klicken, kompilieren)
        timeout-minutes: 12
        run: |
          OUT="$PWD/selftest"
          mkdir -p "$OUT"
          # Ausgabe dieses Schritts mitschreiben (landet im Release "ci-log").
          exec > >(tee "$OUT/step.log") 2>&1
          cat > "$OUT/Probe.tex" <<'EOF'
          \documentclass[11pt,a4paper]{article}
          \usepackage[ngerman]{babel}
          \usepackage{amsmath,amssymb,amsthm}
          \usepackage{lipsum}
          \newtheorem{satz}{Satz}
          \begin{document}
          \section{Grundlagen}
          Für alle $n \in \mathbb{N}$ gilt die Gaußsche Summenformel:
          \begin{equation}
            \sum_{k=1}^{n} k = \frac{n(n+1)}{2}
          \end{equation}
          \begin{satz}
            Es gibt unendlich viele Primzahlen.
          \end{satz}
          \begin{proof} Angenommen, es gäbe nur endlich viele. \end{proof}
          \lipsum[1-12]
          \section{Matrizen}
          \[ A = \begin{pmatrix} 1 & 2 \\ 3 & 4 \end{pmatrix} \]
          \lipsum[13-24]
          \end{document}
          EOF
          rm -f ~/Library/Logs/DiagnosticReports/Lemma* 2>/dev/null || true
          APP="$PWD/build/Build/Products/Release/Lemma.app"
          open -n --env "LEMMA_SELFTEST=$OUT/selftest.log" \
            --stdout "$OUT/app-stdout.log" --stderr "$OUT/app-stderr.log" \
            -a "$APP" "$OUT/Probe.tex"
          # Warten, bis die App sich selbst beendet (höchstens 9 Minuten).
          sleep 5
          for _ in $(seq 1 540); do
            pgrep -xq Lemma || break
            sleep 1
          done
          pkill -x Lemma 2>/dev/null || true
          # Absturzberichte werden mit kurzer Verzögerung geschrieben.
          sleep 10
          cp ~/Library/Logs/DiagnosticReports/Lemma* "$OUT/" 2>/dev/null || true
          echo "--- Selbsttest ---"
          cat "$OUT/selftest.log" 2>/dev/null || echo "(kein Protokoll)"
          ls -la "$OUT"
          grep -q "^FERTIG" "$OUT/selftest.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log
          path: |
            xcodebuild.log
            test.log
            selftest/

      # Protokolle zusätzlich als internes Vorab-Release, damit sie auch ohne
      # Zugriff auf die Actions-Oberfläche lesbar sind (z. B. für Claude).
      - name: Protokolle veröffentlichen
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch xcodebuild.log test.log
          grep -E "(error|warning):" xcodebuild.log | sort -u > diagnostics.txt || true
          # Selbsttest-Ergebnisse (Protokoll, Bildschirmfotos, Absturzberichte) mitliefern.
          mkdir -p selftest
          SELFTEST_FILES=$(find selftest -type f ! -name Probe.tex)
          gh release delete ci-log --yes --cleanup-tag || true
          gh release create ci-log xcodebuild.log test.log diagnostics.txt $SELFTEST_FILES \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "CI-Protokoll (intern)" \
            --notes "Protokolle des letzten Builds von ${GITHUB_REF_NAME} ($(git rev-parse --short HEAD)), Ergebnis: ${{ job.status }}. Nicht zum Installieren gedacht."

      - name: Als "latest" veröffentlichen
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Lemma.zip install.sh \
            --target "$GITHUB_SHA" \
            --title "Lemma (neueste Version)" \
            --notes "Automatisch gebaut aus $(git rev-parse --short HEAD).

          Installieren: Terminal öffnen und eingeben:
          \`curl -fsSL https://github.com/${{ github.repository }}/releases/download/latest/install.sh | sh\`"
