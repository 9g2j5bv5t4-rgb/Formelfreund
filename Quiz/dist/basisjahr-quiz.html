<title>Basisjahr Quiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#F2F3F7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: iOS-artige Einspalten-App. Grosser Titel, Stoffstand-Regler oben,
   Fragekarte darunter, schwebende Tab-Leiste unten. Schreib-Aufgaben auf Häuschenpapier. */
:root {
  --bg: #F2F3F7;          /* gruppierter Hintergrund, leicht Richtung Tinte */
  --card: #FFFFFF;
  --card-2: #F6F7FA;      /* Code, Eingabefelder */
  --line: #DADCE3;
  --fg: #121318;
  --fg-2: #5B5E69;        /* 6.3:1 auf Weiss */
  --fg-3: #80838E;
  --ink: #2547D0;         /* Königsblau: Aktionen */
  --ink-fg: #FFFFFF;
  --ink-soft: #E7ECFC;
  --ok: #1B7A3A;  --ok-bg: #E5F4EA;  --ok-line: #9BD3AE;
  --no: #B4262C;  --no-bg: #FCEAEA;  --no-line: #EDA8AA;
  --tip: #5A4300; --tip-bg: #FFF4D2; --tip-line: #E9CD72;
  --dm: #7A3FC4;  --la: #00788C;  --ad: #B45309;  --ep: #B0246B;
  --grid: rgba(37, 71, 208, 0.07);
  --tk-k: #A626A4; --tk-s: #2E7D32; --tk-n: #B35900; --tk-t: #1E5BB8;
  --glass: rgba(255, 255, 255, 0.72);
  --shadow: 0 1px 2px rgba(18, 19, 24, 0.06), 0 6px 24px rgba(18, 19, 24, 0.06);
  --f-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
  --f-code: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --r-card: 18px;
  --r-ctl: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B0C10; --card: #1A1B21; --card-2: #24252D; --line: #34363F;
    --fg: #F3F4F7; --fg-2: #AEB1BC; --fg-3: #8A8D98;
    --ink: #5B7BFF; --ink-fg: #FFFFFF; --ink-soft: #1F2747;
    --ok: #5AD487; --ok-bg: #12301E; --ok-line: #2B6B42;
    --no: #FF7A7F; --no-bg: #3A1619; --no-line: #7A2E33;
    --tip: #F3D67C; --tip-bg: #2C2410; --tip-line: #6B5520;
    --dm: #C49BFF; --la: #4FD1E6; --ad: #FFAA55; --ep: #FF7DB9;
    --grid: rgba(120, 145, 255, 0.07);
    --tk-k: #E28EF0; --tk-s: #8BD58E; --tk-n: #F2B06B; --tk-t: #82B4FF;
    --glass: rgba(30, 31, 38, 0.72);
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 28px rgba(0,0,0,0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B0C10; --card: #1A1B21; --card-2: #24252D; --line: #34363F;
  --fg: #F3F4F7; --fg-2: #AEB1BC; --fg-3: #8A8D98;
  --ink: #5B7BFF; --ink-fg: #FFFFFF; --ink-soft: #1F2747;
  --ok: #5AD487; --ok-bg: #12301E; --ok-line: #2B6B42;
  --no: #FF7A7F; --no-bg: #3A1619; --no-line: #7A2E33;
  --tip: #F3D67C; --tip-bg: #2C2410; --tip-line: #6B5520;
  --dm: #C49BFF; --la: #4FD1E6; --ad: #FFAA55; --ep: #FF7DB9;
  --grid: rgba(120, 145, 255, 0.07);
  --tk-k: #E28EF0; --tk-s: #8BD58E; --tk-n: #F2B06B; --tk-t: #82B4FF;
  --glass: rgba(30, 31, 38, 0.72);
  --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 28px rgba(0,0,0,0.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--f-ui); font-size: 17px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; border-radius: 8px; }

.app { max-width: 680px; margin: 0 auto; padding-block: 12px 128px; display: flex; flex-direction: column; gap: 16px; }
#main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

/* Kopf */
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-top: 8px; }
.head h1 { font-family: var(--f-display); font-size: 34px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.head .sub { color: var(--fg-2); font-size: 15px; margin: 2px 0 0; }
.today { font-size: 13px; color: var(--fg-2); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.today b { color: var(--fg); font-weight: 600; }

/* Gruppen (iOS Inset Grouped) */
.group { background: var(--card); border-radius: var(--r-card); box-shadow: var(--shadow); overflow: hidden; }
.group-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; padding: 14px 16px; background: none; border: 0; text-align: left; min-height: 52px; }
.group-h .t { font-weight: 600; font-size: 17px; }
.group-h .s { color: var(--fg-2); font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chev { width: 14px; height: 14px; flex: none; transition: transform .2s ease; color: var(--fg-3); }
.group-h[aria-expanded="true"] .chev { transform: rotate(90deg); }

/* Stoffstand-Regler */
.sl-list { display: flex; flex-direction: column; }
.sl { padding: 10px 16px 4px; border-top: 1px solid var(--line); display: grid; gap: 0; }
.sl-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.sl-name { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.sl-val { font-size: 14px; color: var(--fg-2); text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
.sl-val b { color: var(--c); font-weight: 600; }
.range { -webkit-appearance: none; appearance: none; width: 100%; height: 40px; background: transparent; margin: 0; --p: 100%; }
.range::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(to right, var(--c) 0 var(--p), var(--line) var(--p) 100%); }
.range::-moz-range-track { height: 6px; border-radius: 3px; background: var(--line); }
.range::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--c); }
.range::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%; background: #fff; margin-top: -11px; box-shadow: 0 0.5px 4px rgba(0,0,0,.18), 0 3px 8px rgba(0,0,0,.14); border: 0.5px solid rgba(0,0,0,.04); }
.range::-moz-range-thumb { width: 28px; height: 28px; border-radius: 50%; background: #fff; border: 0.5px solid rgba(0,0,0,.04); box-shadow: 0 0.5px 4px rgba(0,0,0,.18), 0 3px 8px rgba(0,0,0,.14); }
.range:focus-visible { outline: none; }
.range:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px var(--ink); }
.sl-foot { padding: 10px 16px 14px; border-top: 1px solid var(--line); font-size: 13px; color: var(--fg-2); }

/* Auswahl: Fächer-Chips und Segmented Control */
.pick { display: flex; flex-direction: column; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { flex: none; min-height: 44px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-size: 15px; font-weight: 500; display: inline-flex; align-items: center; gap: 7px; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip .dot { width: 8px; height: 8px; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--card-2); border-radius: 10px; padding: 2px; gap: 2px; border: 1px solid var(--line); }
.seg button { border: 0; background: transparent; border-radius: 8px; min-height: 34px; font-size: 14px; font-weight: 500; color: var(--fg-2); padding: 4px 6px; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }
.mixnote { font-size: 13px; color: var(--fg-2); margin: 0 4px; }

/* Fragekarte */
.qcard { background: var(--card); border-radius: var(--r-card); box-shadow: var(--shadow); padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.qcard.paper { background-color: var(--card); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 20px 20px; background-position: -1px -1px; }
.meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--fg-2); }
.badge { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--c); font-size: 13px; letter-spacing: 0.01em; }
.meta .sep { color: var(--fg-3); }
.diff { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--fg-2); font-weight: 500; }
.pips { display: inline-flex; gap: 3px; }
.pips i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.pips i.on { background: var(--fg-2); }
.kind { font-size: 12px; font-weight: 600; color: var(--ink); background: var(--ink-soft); padding: 2px 8px; border-radius: 999px; }
.qtext { font-size: 18px; line-height: 1.45; margin: 0; overflow-wrap: anywhere; }
.qtext p, .rich p { margin: 0 0 0.6em; }
.qtext p:last-child, .rich p:last-child { margin-bottom: 0; }
.rich ul { margin: 0.2em 0 0.6em; padding-left: 1.2em; }
.rich li { margin: 0.15em 0; }
code, pre.code { font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
code { font-family: var(--f-code); font-size: 0.86em; background: var(--card-2); border: 1px solid var(--line); border-radius: 6px; padding: 0.05em 0.35em; overflow-wrap: anywhere; }
pre.code { margin: 0; background: var(--card-2); border: 1px solid var(--line); border-radius: var(--r-ctl); padding: 12px 14px; overflow-x: auto; font-family: var(--f-code); font-size: 14px; line-height: 1.5; tab-size: 4; }
pre.code code { background: none; border: 0; padding: 0; font-size: inherit; overflow-wrap: normal; }
.tk-k { color: var(--tk-k); font-weight: 600; } .tk-s { color: var(--tk-s); } .tk-n { color: var(--tk-n); } .tk-c { color: var(--fg-3); font-style: italic; } .tk-t { color: var(--tk-t); }

/* Mathe-Mini-Satz */
.m { font-family: var(--f-math); font-size: 1.08em; white-space: nowrap; }
.m sub, .m sup { font-size: 0.72em; line-height: 0; }
.fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 0.12em; font-size: 0.92em; }
.fr > span:first-child { border-bottom: 1px solid currentColor; padding: 0 0.15em; }
.fr > span:last-child { padding: 0 0.15em; }
.mx { display: inline-grid; vertical-align: middle; margin: 0.25em 0.2em; padding: 0.1em 0.35em; column-gap: 0.75em; row-gap: 0.05em; position: relative; text-align: center; white-space: nowrap; }
.mx::before, .mx::after { content: ""; position: absolute; top: 0; bottom: 0; width: 0.32em; border: 1.3px solid currentColor; }
.mx::before { left: 0; border-right: 0; border-radius: 3px 0 0 3px; }
.mx::after { right: 0; border-left: 0; border-radius: 0 3px 3px 0; }
.sq { white-space: nowrap; } .sq > span { border-top: 1px solid currentColor; padding-top: 0.05em; }
.mt { font-family: var(--f-ui); font-size: 0.92em; }
.m.blk { display: block; text-align: center; margin: 0.4em 0; white-space: normal; overflow-x: auto; }

/* Antwortoptionen */
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; text-align: left; width: 100%; padding: 12px 14px; min-height: 52px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); transition: border-color .15s, background .15s; }
.opt:hover:not([disabled]) { border-color: var(--fg-3); }
.opt .key { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); display: grid; place-items: center; font-size: 13px; font-weight: 600; color: var(--fg-2); background: var(--card-2); }
.opt.multi .key { border-radius: 7px; }
.opt .ot { min-width: 0; overflow-wrap: anywhere; padding-top: 2px; }
.opt[aria-pressed="true"] { border-color: var(--ink); background: var(--ink-soft); }
.opt[aria-pressed="true"] .key { background: var(--ink); color: var(--ink-fg); border-color: var(--ink); }
.opt.right { border-color: var(--ok-line); background: var(--ok-bg); }
.opt.right .key { background: var(--ok); color: var(--card); border-color: var(--ok); }
.opt.wrong { border-color: var(--no-line); background: var(--no-bg); }
.opt.wrong .key { background: var(--no); color: var(--card); border-color: var(--no); }
.opt.dim { opacity: 0.62; }
.opt[disabled] { cursor: default; }
.opt .why { display: block; font-size: 14px; color: var(--fg-2); margin-top: 6px; line-height: 1.4; }
.opt.wrong .why, .opt.right .why { color: var(--fg); }

/* Wahr/Falsch-Serie */
.tf { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.tf-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 12px 12px 12px 14px; border-top: 1px solid var(--line); }
.tf-row:first-child { border-top: 0; }
.tf-row .st { min-width: 0; overflow-wrap: anywhere; }
.tf-row .why { grid-column: 1 / -1; font-size: 14px; color: var(--fg-2); }
.tf-row.right { background: var(--ok-bg); } .tf-row.wrong { background: var(--no-bg); }
.tf-btns { display: inline-flex; gap: 6px; }
.tf-btns button { min-width: 64px; min-height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); font-size: 14px; font-weight: 600; color: var(--fg-2); }
.tf-btns button[aria-pressed="true"] { background: var(--ink); color: var(--ink-fg); border-color: var(--ink); }
.tf-btns button.sol { outline: 2px solid var(--ok); outline-offset: 1px; }

/* Buttons */
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { min-height: 50px; padding: 12px 20px; border-radius: 14px; border: 0; font-weight: 600; font-size: 17px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn-pri { background: var(--ink); color: var(--ink-fg); flex: 1 1 auto; }
.btn-pri[disabled] { opacity: 0.4; cursor: default; }
.btn-sec { background: var(--ink-soft); color: var(--ink); }
.btn-plain { background: none; color: var(--ink); padding-inline: 6px; font-weight: 500; font-size: 16px; min-height: 44px; }
.btn-danger { background: var(--no-bg); color: var(--no); }

/* Rückmeldung */
.verdict { border-radius: 14px; padding: 14px 16px; border: 1px solid; display: flex; flex-direction: column; gap: 6px; }
.verdict.ok { background: var(--ok-bg); border-color: var(--ok-line); }
.verdict.no { background: var(--no-bg); border-color: var(--no-line); }
.verdict.neutral { background: var(--card-2); border-color: var(--line); }
.verdict .vh { font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 8px; }
.verdict.ok .vh { color: var(--ok); } .verdict.no .vh { color: var(--no); }
.merke { background: var(--tip-bg); border: 1px solid var(--tip-line); color: var(--fg); border-radius: 14px; padding: 12px 16px; font-size: 16px; }
.merke b { color: var(--tip); }
.src { font-size: 13px; color: var(--fg-3); }

/* Schreib-Modus */
.task-label { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-2); }
.hint { border-radius: 14px; border: 1px dashed var(--line); padding: 12px 14px; background: var(--card); font-size: 16px; }
.ansrow { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }
.ansrow label { width: 100%; font-size: 14px; color: var(--fg-2); font-weight: 500; }
.field { flex: 1 1 180px; min-width: 0; min-height: 50px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); padding: 10px 14px; font-size: 17px; font-family: var(--f-ui); }
.field:focus { outline: 3px solid var(--ink-soft); border-color: var(--ink); }
.anshint { font-size: 13px; color: var(--fg-3); width: 100%; }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: st; display: flex; flex-direction: column; gap: 10px; }
.steps li { counter-increment: st; display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; }
.steps li::before { content: counter(st); width: 26px; height: 26px; border-radius: 50%; background: var(--ink-soft); color: var(--ink); font-size: 13px; font-weight: 700; display: grid; place-items: center; }
.steps li > div { min-width: 0; overflow-wrap: anywhere; padding-top: 1px; }
.rich pre.code { margin: 0.4em 0; font-size: 13px; }
.result { border-left: 3px solid var(--ink); padding: 6px 0 6px 12px; font-weight: 500; }
.selfrate { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.selfrate button { min-height: 50px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-weight: 600; font-size: 15px; padding: 6px; }
.selfrate button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

/* Leerer Zustand */
.empty { text-align: center; padding: 28px 18px; color: var(--fg-2); }
.empty h2 { color: var(--fg); font-size: 20px; margin: 0 0 6px; }

/* Fortschritt */
.stat-h { display: flex; align-items: baseline; justify-content: space-between; padding: 14px 16px 6px; gap: 10px; }
.stat-h h2 { margin: 0; font-size: 20px; display: flex; align-items: center; gap: 8px; }
.stat-h .big { font-size: 15px; color: var(--fg-2); font-variant-numeric: tabular-nums; }
.trow { display: grid; grid-template-columns: minmax(0, 1fr) 64px 44px; gap: 10px; align-items: center; padding: 9px 16px; border-top: 1px solid var(--line); font-size: 14px; }
.trow .tn { min-width: 0; overflow-wrap: anywhere; }
.trow .tn small { color: var(--fg-3); margin-right: 6px; font-variant-numeric: tabular-nums; }
.trow.off { color: var(--fg-3); }
.bar { height: 8px; border-radius: 4px; background: var(--card-2); overflow: hidden; border: 1px solid var(--line); }
.bar > i { display: block; height: 100%; background: var(--c); border-radius: 4px; }
.trow .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--fg-2); }
.about { padding: 14px 16px; font-size: 15px; color: var(--fg-2); display: flex; flex-direction: column; gap: 8px; }
.about b { color: var(--fg); }
.confirm { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 0 16px 16px; }

/* Tab-Leiste (schwebend, Glas nur hier) */
.tabbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 20; display: flex; gap: 4px; padding: 6px; border-radius: 999px; background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); box-shadow: 0 8px 30px rgba(0,0,0,.16), 0 0 0 0.5px var(--line); width: min(420px, calc(100% - 2 * max(16px, env(safe-area-inset-left, 0px)))); }
.tab { flex: 1; min-height: 52px; border: 0; background: transparent; border-radius: 999px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--fg-2); }
.tab svg { width: 24px; height: 24px; }
.tab[aria-selected="true"] { color: var(--ink); background: var(--ink-soft); }
@media (prefers-reduced-transparency: reduce) { .tabbar { background: var(--card); -webkit-backdrop-filter: none; backdrop-filter: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
.fade-in { animation: fadein .22s ease-out; }
@keyframes fadein { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (min-width: 720px) {
  .head h1 { font-size: 40px; }
  .qtext { font-size: 19px; }
}
</style>

<div class="app" id="app">
  <header class="head">
    <div>
      <h1 id="title">Unterwegs</h1>
      <p class="sub" id="subtitle">Antippen, lesen, weiter.</p>
    </div>
    <div class="today" id="today" aria-live="polite"></div>

    o: ['1.0', '1.5', '1', '2.0'], a: 0,
    w: { 1: 'Das ergibt `1 + (double) 1 / 2`: dort wird die Division mit einem double gerechnet.', 2: 'Durch den Cast ist der linke Summand ein double, das Ergebnis also auch.' },
    e: 'Der Cast bindet nur an seinen rechten Operanden, also an die erste 1. `1 / 2` bleibt eine Ganzzahldivision und ergibt 0. Dann `1.0 + 0` = `1.0`.',
    m: 'Ein Cast wirkt nur auf den Operanden direkt rechts daneben.', s: 'Folien EProg Kap. 2.3, Folie 110' },

  { id: 'ep2-06', t: 'ep2', d: 3, k: 'sc',
    q: 'Was gibt dieser Code aus?', code: "System.out.println('a' + 'b' + \"c\");", out: '195c',
    o: ['195c', 'abc', 'ab c', 'Compilerfehler'], a: 0,
    w: { 1: 'Zwei `char`-Werte werden mit `+` als Zahlen addiert, nicht verkettet.', 3: '`char` ist ein Zahlentyp, `char + char` ist erlaubt.' },
    e: '`char` ist ein ganzzahliger Typ: \'a\' hat den Wert 97, \'b\' den Wert 98. Zuerst wird addiert: 97 + 98 = 195 (`int`). Erst dann kommt der String: `195 + "c"` = `"195c"`.',
    m: 'Mit `"" + \'a\' + \'b\'` erhält man `"ab"`: der String muss zuerst kommen.', s: 'Folien EProg Kap. 2.3, Folien 68 und 113' },

  { id: 'ep2-07', t: 'ep2', d: 3, k: 'sc',
    q: 'Was gibt dieser Code aus?', code: 'int x = 2147483647;  // grösster int-Wert\nx = x + 1;\nSystem.out.println(x);', out: '-2147483648',
    o: ['-2147483648', '2147483648', 'Laufzeitfehler (Überlauf)', '2147483647'], a: 0,
    w: { 1: 'Diesen Wert kann ein `int` (32 Bit) nicht speichern.', 2: 'Java meldet einen Überlauf bei `int` nicht, es rechnet „wie eine Uhr“ weiter.' },
    e: '`int` hat 32 Bit. Nach dem grössten Wert MAX kommt beim Addieren der kleinste Wert MIN: MAX + 1 == MIN. Das passiert stillschweigend, ohne Fehlermeldung.',
    m: 'Über- und Unterlauf bei `int` und `long`: wie bei einer Uhr, ohne Fehler.', s: 'Folien EProg Kap. 2.3, Folie 86' },

  { id: 'ep2-08', t: 'ep2', d: 1, k: 'sc',
    q: 'In einer Datei `Rechner.java` steht `public class Taschenrechner { … }` mit einer korrekten `main`-Methode. Was passiert?',
    o: ['Compilerfehler: Klassenname und Dateiname müssen übereinstimmen', 'Das Programm läuft normal', 'Laufzeitfehler beim Start', 'Der Compiler benennt die Datei automatisch um'],
    a: 0,
    e: 'Eine `public class Name` muss in der Datei `Name.java` stehen. Sonst bricht schon der Compiler ab.',
    m: 'Programmname = Dateiname, und pro Datei eine öffentliche Klasse.', s: 'Folien EProg Kap. 2.1, Folie 10' },

  { id: 'ep2-09', t: 'ep2', d: 2, k: 'sc',
    q: 'Was passiert bei diesem Code **in einer Java-Datei** (nicht in der JShell)?', code: 'int teeth;\nSystem.out.println(teeth);', out: '#compile-error',
    o: ['Compilerfehler: Variable nicht initialisiert', 'Ausgabe 0', 'Ausgabe null', 'Laufzeitfehler'],
    a: 0,
    w: { 1: 'So verhält sich die JShell, nicht der normale Compiler.', 2: 'null gibt es nur für Referenztypen, und auch die müssen lokal initialisiert werden.' },
    e: 'Lokale Variablen haben keinen Standardwert. Wird der Wert gelesen, bevor er zugewiesen wurde, meldet der Compiler einen Fehler. Die JShell ist hier eine Ausnahme und setzt 0.',
    m: 'Lokale Variablen: kein Standardwert. Array-Elemente und Attribute: schon.', s: 'Folien EProg Kap. 2.3, Folien 77 und 125' },

  { id: 'ep2-10', t: 'ep2', d: 1, k: 'sc',
    q: '`Random rand = new Random();` Welcher Ausdruck liefert eine zufällige ganze Zahl aus **[5, 10]** (beide Grenzen inklusive)?',
    o: ['`5 + rand.nextInt(6)`', '`5 + rand.nextInt(5)`', '`rand.nextInt(10) + 5`', '`rand.nextInt(5, 10)`'],
    a: 0,
    w: { 1: 'Liefert nur 5 bis 9.', 2: 'Liefert 5 bis 14.', 3: 'Diese Variante wurde in der Vorlesung nicht eingeführt, und die obere Grenze wäre exklusiv.' },
    e: '`nextInt(n)` liefert eine Zahl aus {0, …, n−1}. Für [min, max] braucht man `min + rand.nextInt(max - min + 1)`, hier `5 + rand.nextInt(6)`.',
    m: '`nextInt(n)`: obere Grenze n ist exklusiv.', s: 'Folien EProg Kap. 2.4, Folien 145–146' },

  { id: 'ep2-11', t: 'ep2', d: 2, k: 'sc',
    q: 'Welche Werte kann `3 * rand.nextInt(4) - 2` annehmen?',
    o: ['{−2, 1, 4, 7}', '{−2, 1, 4, 7, 10}', '{1, 4, 7, 10}', '{−2, …, 10}'],
    a: 0,
    e: '`rand.nextInt(4)` liefert 0, 1, 2 oder 3. Mal 3: 0, 3, 6, 9. Minus 2: −2, 1, 4, 7.',
    m: 'Erst den Wertebereich von `nextInt(n)` aufschreiben, dann umrechnen.', s: 'Folien EProg Kap. 2.4, Folie 149' },

  { id: 'ep2-12', t: 'ep2', d: 2, k: 'sc',
    q: 'Die Eingabe ist `Minnie Mouse` (dann Enter). Was gibt das Programm aus?',
    code: 'Scanner console = new Scanner(System.in);\nString name = console.next();\nname = name.toUpperCase();\nSystem.out.println(name + " has " + name.length() + " letters");',
    o: ['MINNIE has 6 letters', 'MINNIE MOUSE has 12 letters', 'MINNIE MOUSE has 11 letters', 'Minnie has 6 letters'],
    a: 0,
    w: { 1: 'So wäre es mit `nextLine()`.', 3: 'Das Ergebnis von `toUpperCase()` wird wieder in `name` gespeichert.' },
    e: '`next()` liest nur ein Token bis zum nächsten Zwischenraum, also `Minnie`. Das wird in Grossbuchstaben umgewandelt und zurück in `name` gespeichert.',
    m: '`next()` = ein Wort, `nextLine()` = ganze Zeile.', s: 'Folien EProg Kap. 2.4, Folien 142–143' },

  { id: 'ep2-13', t: 'ep2', d: 2, k: 'mc',
    q: 'Welche Zeilen kompilieren? Wähle alle.',
    o: ['`long a = 5;`', '`double b = 5;`', '`int c = 5L;`', '`int d = 5.0;`', '`int e = (int) 5.9;`'],
    a: [0, 1, 4],
    w: { 0: 'int → long: implizit erlaubt.', 1: 'int → double: implizit erlaubt.', 2: 'long → int verliert potenziell Information, braucht einen Cast.', 3: 'double → int braucht einen expliziten Cast.', 4: 'Mit Cast erlaubt, ergibt 5 (abgeschnitten).' },
    e: 'Vom kleineren zum grösseren Typ (int → long → double) wandelt Java automatisch um. In die andere Richtung braucht es einen expliziten Cast.',
    m: 'Implizit nur in Richtung „grösserer Typ“.', s: 'Folien EProg Kap. 2.3, Folie 111' },

  { id: 'ep2-14', t: 'ep2', d: 2, k: 'sc',
    q: 'Was gibt dieses Programm aus?',
    code: 'static void a() {\n    System.out.print("A");\n    b();\n    System.out.print("a");\n}\nstatic void b() {\n    System.out.print("B");\n}\n\na();\nb();\na();',
    out: 'ABaBABa',
    o: ['ABaBABa', 'AaBAa', 'ABBAB', 'AaBBAaB'], a: 0,
    e: 'Ein Methodenaufruf springt in die Methode, führt sie ganz aus und kehrt dann hinter den Aufruf zurück. `a()` gibt also A, dann B (aus `b()`), dann a aus. Insgesamt: `ABa` + `B` + `ABa`.',
    m: 'Kontrollfluss: hinein, ganz ausführen, zurück hinter den Aufruf.', s: 'Folien EProg Kap. 2.2, Folien 54–57' },

  { id: 'ep2-15', t: 'ep2', d: 2, k: 'sc',
    q: 'Was gibt dieser Code aus?', code: 'int sum = 7;\nint n = 2;\ndouble avg = sum / n;\nSystem.out.println(avg);', out: '3.0',
    o: ['3.0', '3.5', '3', 'Compilerfehler'], a: 0,
    w: { 1: 'Die Division passiert vor der Zuweisung, und zwar mit zwei `int`.', 2: '`avg` ist ein double, also wird `3.0` ausgegeben.', 3: 'int → double ist eine erlaubte implizite Umwandlung.' },
    e: '`sum / n` ist `int / int` = 3. Erst danach wird 3 für die Zuweisung in einen double umgewandelt: 3.0. Richtig wäre `(double) sum / n`.',
    m: 'Der Zieltyp der Variable beeinflusst die Rechnung rechts nicht.', s: 'Folien EProg Kap. 4, Folie 38 (Durchschnitt)' },

  { id: 'ep2-16', t: 'ep2', d: 2, k: 'sc',
    q: 'Wie viele Zeilen gibt dieser Code aus?', code: 'System.out.println("C:\\neuer-S\\tiefel");', out: 'C:\neuer-S\tiefel',
    o: ['2', '1', '3', 'Compilerfehler wegen ungültiger Escape-Sequenz'], a: 0,
    w: { 1: '`\\n` im String ist ein Zeilenumbruch, kein Backslash plus n.', 3: '`\\n` und `\\t` sind gültige Escape-Sequenzen.' },
    e: 'Im Literal steht `\\n` (neue Zeile) und `\\t` (Tabulator). Ausgabe: Zeile 1 `C:`, Zeile 2 `euer-S` gefolgt von einem Tab und `iefel`. Für einen echten Backslash bräuchte es `\\\\`.',
    m: 'Windows-Pfade in Java-Strings: jeden Backslash verdoppeln.', s: 'Folien EProg Kap. 2.1, Folien 33–35' },

  { id: 'ep2-17', t: 'ep2', d: 3, k: 'sc', fix: true,
    q: 'Was gibt dieser Code aus?', code: 'System.out.println(7 / 3 * 1.2 + 3 / 2);', out: '3.4',
    o: ['3.4', '4.3', '2.8', '3.0'], a: 0,
    w: { 1: 'Das wäre mit 7.0 / 3 * 1.2 + 1.5 ungefähr der Fall, aber 7 / 3 und 3 / 2 sind Ganzzahldivisionen.' },
    e: 'Von links, Punkt vor Strich: `7 / 3` = 2 (int), `2 * 1.2` = 2.4 (double), `3 / 2` = 1 (int), `2.4 + 1` = 3.4. Die Umwandlung zu double passiert pro Operator, nicht für den ganzen Ausdruck.',
    m: 'Typen pro Operator bestimmen, am besten mit einem Ausdrucksbaum.', s: 'Folien EProg Kap. 2.3, Folien 105–106' },

  { id: 'ep2-18', t: 'ep2', d: 3, k: 'sc',
    q: 'Was gibt dieser Code aus?', code: 'System.out.println(0.1 + 0.2 == 0.3);', out: 'false',
    o: ['false', 'true', 'Compilerfehler', '0.3'], a: 0,
    w: { 1: '0.1, 0.2 und 0.3 sind als double nicht exakt darstellbar.', 3: '`==` liefert einen boolean.' },
    e: 'double-Werte sind endliche Binärdarstellungen. 0.1 + 0.2 ergibt 0.30000000000000004, also nicht genau den double-Wert von 0.3.',
    m: 'double ≠ reelle Zahlen: Rundungsfehler einplanen, double nie mit `==` vergleichen.', s: 'Folien EProg Kap. 2.3, Folie 103' },

  { id: 'ep2-19', t: 'ep2', d: 1, k: 'sc',
    q: 'Was gibt dieser Code aus?', code: 'System.out.println("// Kommentar");', out: '// Kommentar',
    o: ['// Kommentar', 'nichts, die Zeile ist ein Kommentar', 'eine leere Zeile', 'Compilerfehler'], a: 0,
    w: { 1: 'Innerhalb eines String-Literals beginnt kein Kommentar.', 2: 'Der String ist nicht leer.' },
    e: 'Zwischen Anführungszeichen sind `//` gewöhnliche Zeichen. Ein Kommentar beginnt nur im Code ausserhalb von Strings.',
    m: 'Strings schützen ihren Inhalt vor der Interpretation als Code.', s: 'Folien EProg Kap. 2.1, Folie 36' },

  { id: 'ep2-20', t: 'ep2', d: 3, k: 'sc', fix: true,
    q: 'Was gibt dieser Code aus?', code: 'System.out.println((int) -2.7 + (int) 2.7 + (int) (2.7 + 0.5));', out: '3',
    o: ['3', '2', '4', '1'], a: 0,
    w: { 1: 'Der Cast schneidet ab, er rundet nicht ab: (int) −2.7 ist −2, nicht −3.', 2: '(int) 2.7 ist 2, nicht 3.' },
    e: 'Der Cast nach `int` schneidet Richtung 0 ab: (int) −2.7 = −2, (int) 2.7 = 2, (int) 3.2 = 3. Summe: −2 + 2 + 3 = 3. Mit `+ 0.5` erreicht man für positive Zahlen ein Runden.',
    m: '`(int)` schneidet die Nachkommastellen ab, auch bei negativen Zahlen.', s: 'Folien EProg Kap. 2.3, Folie 109' },

  { id: 'ep2-w1', t: 'ep2', d: 2, k: 'w',
    q: 'Bestimme Wert **und Typ** jedes Ausdrucks auf Papier:\n- `5 / 2 * 2.0 + 7 % 4 * 1.5`\n- `"x" + 7 / 2 + 7 % 2 + (7 / 2.0)`\n- `20 % 8 + 15 / 27 / (3 % 6)`\nTippe den Wert des **ersten** Ausdrucks zur Kontrolle ein.',
    ans: { k: 'num', v: 8.5 },
    hint: 'Klammere implizit nach Präzedenz und Assoziativität und bestimme die Typen pro Operator.',
    sol: [
      '`5 / 2` = 2 (int), `2 * 2.0` = 4.0 (double), `7 % 4` = 3 (int), `3 * 1.5` = 4.5 (double), Summe 8.5 (double).',
      '`7 / 2` = 3 und `7 % 2` = 1 werden zuerst berechnet. Dann von links verketten: `"x" + 3` = `"x3"`, `+ 1` = `"x31"`, `+ 3.5` = `"x313.5"` (String).',
      '`20 % 8` = 4, `15 / 27` = 0, `3 % 6` = 3, `0 / 3` = 0, Summe 4 (int).'
    ],
    res: '8.5 (double) · `"x313.5"` (String) · 4 (int)',
    m: 'Erst Ausdrucksbaum bilden, dann pro Knoten Typ und Wert.', s: 'Folien EProg Kap. 2.3' },

  { id: 'ep2-w2', t: 'ep2', d: 2, k: 'w',
    q: 'Gib ein Java-String-Literal an, das mit `System.out.println(…)` genau diese Ausgabe erzeugt:\n`/ \\ /// \\\\\\`',
    ans: { k: 'str', v: ['"/ \\\\ /// \\\\\\\\\\\\"'], ph: 'z. B. "…"', note: 'Mit Anführungszeichen eintippen.' },
    sol: [
      'Normale Zeichen wie `/` und Leerzeichen bleiben, wie sie sind.',
      'Jeder Backslash muss als `\\\\` geschrieben werden. In der Ausgabe stehen 1 + 3 = 4 Backslashes, im Literal also 8.',
      'Literal: `"/ \\\\ /// \\\\\\\\\\\\"`'
    ],
    res: '`"/ \\\\ /// \\\\\\\\\\\\"`',
    m: '`\\\\` erzeugt einen Backslash, `\\"` ein Anführungszeichen.', s: 'Folien EProg Kap. 2.1, Folie 36' },

  { id: 'ep2-w3', t: 'ep2', d: 1, k: 'w',
    q: 'Schreibe einen Ausdruck mit `Random rand`, der eine **zufällige ungerade Zahl von 3 bis 15** (inklusive) liefert. Alle Werte sollen gleich wahrscheinlich sein.',
    sol: [
      'Die gewünschten Werte sind 3, 5, 7, …, 15. Das sind 7 Werte im Abstand 2.',
      'Also eine Zufallszahl aus {0, …, 6} wählen: `rand.nextInt(7)`.',
      'Mit 2 multiplizieren und 3 addieren: `3 + 2 * rand.nextInt(7)`.'
    ],
    res: '`3 + 2 * rand.nextInt(7)`',
    m: 'Anzahl Werte zählen, dann skalieren und verschieben.', s: 'Folien EProg Kap. 2.4, Folie 149' },

  // ---------------- Kapitel 3: Kontrollstrukturen ----------------
  { id: 'ep3-01', t: 'ep3', d: 2, k: 'sc',
    q: 'Was gibt dieser Code aus?',
    code: 'boolean b = false;\nif (b = true) {\n    System.out.println("eins");\n} else {\n    System.out.println("zwei");\n}',
    out: 'eins',
    o: ['eins', 'zwei', 'Compilerfehler', 'nichts'], a: 0,
    w: { 1: '`b = true` ist eine Zuweisung, kein Vergleich.', 2: 'Hier kompiliert es, weil die Zuweisung den Typ boolean hat.' },
    e: '`b = true` weist true zu und hat selbst den Wert true. Deshalb wird immer der if-Zweig ausgeführt. Mit `int` (`if (x = 0)`) gäbe es dagegen einen Compilerfehler.',
    m: '`=` ist Zuweisung, `==` ist Vergleich. Boolesche Variablen am besten direkt testen: `if (b)`.', s: 'Folien EProg Kap. 3.1, Folien 10–11' },

  { id: 'ep3-02', t: 'ep3', d: 1, k: 'sc',
    q: 'Was passiert bei `int x = 5;` gefolgt von `if (2 <= x <= 10) { … }`?',
    o: ['Compilerfehler', 'Die Bedingung ist true', 'Die Bedingung ist false', 'Laufzeitfehler'],
    a: 0,
    e: 'Ausgewertet wird `(2 <= x) <= 10`, also `true <= 10`. Einen boolean kann man nicht mit `<=` vergleichen: „bad operand types“. Richtig: `2 <= x && x <= 10`.',
    m: 'Vergleiche nicht verketten, sondern mit `&&` verbinden.', s: 'Folien EProg Kap. 3.1, Folie 9' },

  { id: 'ep3-03', t: 'ep3', d: 2, k: 'sc', fix: true,
    q: 'Was gibt dieser Code aus?', code: 'int x = 2;\nboolean p = false;\nboolean q = p && x++ < 3;\nSystem.out.println(x + " " + q);', out: '2 false',
    o: ['2 false', '3 false', '3 true', '2 true'], a: 0,
    w: { 1: '`x++` wird wegen der Kurzschlussauswertung gar nicht ausgeführt.' },
    e: 'Bei `p && …` mit p == false steht das Ergebnis schon fest. Java wertet den rechten Operanden nicht aus, also passiert auch der Seiteneffekt `x++` nicht.',
    m: 'Kurzschluss: `&&` stoppt bei false, `||` stoppt bei true.', s: 'Folien EProg Kap. 3.4, Folie 123' },

  { id: 'ep3-04', t: 'ep3', d: 3, k: 'sc',
    q: 'Was gibt dieser Code aus?', code: 'int x = 2;\nSystem.out.println(++x + x++ + " " + x + ++x + x);', out: '6 455',
    o: ['6 455', '6 4 5 5', '5 455', '6 345'], a: 0,
    w: { 1: 'Nach dem String wird verkettet, ohne Leerzeichen zwischen den Zahlen.', 2: '`++x` erhöht zuerst (3), `x++` liefert dann 3 und erhöht auf 4: 3 + 3 = 6.', 3: 'Vor dem dritten Summanden wurde x durch `x++` schon auf 4 erhöht.' },
    e: '`++x`: x wird 3, Wert 3. `x++`: Wert 3, x wird 4. Summe 6 (int). Ab `" "` wird verkettet: `"6 "` + x (4) + `++x` (x wird 5, Wert 5) + x (5) = `"6 455"`.',
    m: 'Prä-Inkrement: erst ändern, dann lesen. Post-Inkrement: erst lesen, dann ändern.', s: 'Folien EProg Kap. 3.4, Folie 122' },

  { id: 'ep3-05', t: 'ep3', d: 3, k: 'sc', fix: true,
    q: 'Was gibt dieser Code aus?', code: 'int a = 1;\na = a++;\nint b = 10;\nint c = b-- - b--;\nSystem.out.println(a + " " + b + " " + c);', out: '1 8 1',
    o: ['1 8 1', '2 8 1', '1 8 0', '2 9 1'], a: 0,
    w: { 1: '`a++` liefert den alten Wert 1, und genau dieser wird danach wieder a zugewiesen.', 2: 'Der erste Operand ist 10, der zweite 9.', 3: 'b wird zweimal dekrementiert.' },
    e: '`a = a++`: rechts wird 1 gelesen, a kurz auf 2 erhöht, dann bekommt a den gelesenen Wert 1 zurück. `b-- - b--`: erster Operand 10 (b wird 9), zweiter 9 (b wird 8), also c = 1.',
    m: 'Eine Zuweisung wertet zuerst die rechte Seite komplett aus, dann wird gespeichert.', s: 'Folien EProg Kap. 3.4, Folie 120' },

  { id: 'ep3-06', t: 'ep3', d: 2, k: 'sc', fix: true,
    q: 'Was gibt dieser Code aus?', code: 'int x = 5;\nx =+ 3;\nSystem.out.println(x);', out: '3',
    o: ['3', '8', '5', 'Compilerfehler'], a: 0,
    w: { 1: 'Das wäre `x += 3`.', 3: '`=+ 3` ist gültig: Zuweisung von `+3`.' },
    e: '`x =+ 3` ist dasselbe wie `x = +3` (unäres Plus). x wird also 3, nicht 8. Ein klassischer Tippfehler, den der Compiler nicht bemerkt.',
    m: '`x += 3` erhöht, `x =+ 3` überschreibt.', s: 'Folien EProg Kap. 3.4, Folie 121' },

  { id: 'ep3-07', t: 'ep3', d: 1, k: 'sc',
    q: 'Was gibt dieser Code aus?', code: 'for (int i = 10; i >= 1; i = i - 3) {\n    System.out.print(i + " ");\n}', out: '10 7 4 1',
    o: ['10 7 4 1', '10 7 4', '7 4 1', '10 7 4 1 -2'], a: 0,
    e: 'Test vor jedem Durchlauf: 10, 7, 4, 1 erfüllen `i >= 1`. Nach 1 kommt −2, dann bricht die Schleife ab.',
    m: 'Bei for-Schleifen: Initialisierung, dann Test, Rumpf, Update, Test, …', s: 'Folien EProg Kap. 3.2, Folien 36–40' },

  { id: 'ep3-08', t: 'ep3', d: 2, k: 'sc', fix: true,
    q: 'Was gibt dieser Code aus?', code: 'int n = 1;\nwhile (n * n < 300) {\n    n = n * 3;\n}\nSystem.out.println(n);', out: '27',
    o: ['27', '9', '81', '17'], a: 0,
    w: { 1: 'Bei n = 9 ist n·n = 81 < 300, die Schleife läuft weiter.', 3: '17 ist die grösste Zahl mit n·n < 300, aber n wächst in Dreierpotenzen.' },
    e: 'n: 1 (1 < 300) → 3 (9 < 300) → 9 (81 < 300) → 27. Jetzt ist 27·27 = 729 ≥ 300, die Schleife endet mit n = 27.',
    m: 'Die Bedingung wird vor jedem Durchlauf geprüft, auch nach dem letzten Update.', s: 'Folien EProg Kap. 3.2, Folie 56' },

  { id: 'ep3-09', t: 'ep3', d: 1, k: 'sc',
    q: 'Was gibt dieser Code aus?', code: 'int i = 10;\ndo {\n    System.out.print(i);\n    i++;\n} while (i < 5);', out: '10',
    o: ['10', 'nichts', '10111213…', 'Compilerfehler'], a: 0,
    w: { 1: 'Bei do-while wird der Test erst nach dem Rumpf geprüft.' },
    e: 'Eine do-while-Schleife führt den Rumpf immer mindestens einmal aus. Danach ist `i < 5` falsch, also endet sie.',
    m: 'do-while: mindestens eine Iteration.', s: 'Folien EProg Kap. 3.4, Folie 149' },

  { id: 'ep3-10', t: 'ep3', d: 1, k: 'sc',
    q: 'Was passiert?', code: 'for (int i = 1; i <= 3; i++) {\n    System.out.print(i);\n}\nSystem.out.println(i);', out: '#compile-error',
    o: ['Compilerfehler', 'Ausgabe 1234', 'Ausgabe 1233', 'Laufzeitfehler'], a: 0,
    e: 'Eine im Kopf der for-Schleife deklarierte Variable existiert nur in der Schleife. Danach ist `i` unbekannt: „cannot find symbol“.',
    m: 'Scope einer Variable: von der Deklaration bis zum Ende ihres Blocks.', s: 'Folien EProg Kap. 3.3, Folien 101–103' },

  { id: 'ep3-11', t: 'ep3', d: 3, k: 'sc',
    q: 'Gegeben sind beide Methoden. Welcher Aufruf führt zu einem **Compilerfehler**?',
    code: 'static String foo(int a, double b) { return "int double"; }\nstatic String foo(double a, int b) { return "double int"; }',
    o: ['`foo(1, 1)`', '`foo(1, 1.0)`', '`foo(1.0, 1)`', 'keiner'], a: 0,
    w: { 1: 'Passt eindeutig zur ersten Methode.', 2: 'Passt eindeutig zur zweiten Methode.' },
    e: 'Für `foo(1, 1)` passen beide Methoden gleich gut (jeweils eine int → double-Umwandlung). Es gibt keine eindeutig beste Methode, also ist der Aufruf mehrdeutig. Auch `foo(1.0, 1.0)` ginge nicht: dort passt gar keine.',
    m: 'Überladung braucht eine eindeutig beste Methode.', s: 'Folien EProg Kap. 3.3, Folie 114' },

  { id: 'ep3-12', t: 'ep3', d: 2, k: 'sc',
    q: 'Warum kompiliert diese Methode nicht?',
    code: 'static int max(int a, int b) {\n    if (a >= b) {\n        return a;\n    } else if (b > a) {\n        return b;\n    }\n}',
    o: ['Der Compiler sieht einen Weg ohne `return` (das fehlende else)', 'Eine Methode darf nur ein `return` haben', '`else if` ist nach einem `return` nicht erlaubt', 'Der Rückgabetyp müsste `void` sein'], a: 0,
    w: { 1: 'Mehrere return-Anweisungen sind erlaubt.' },
    e: 'Der Compiler prüft nicht, dass die Bedingungen logisch alle Fälle abdecken. Nach dem `else if` gibt es für ihn einen impliziten else-Fall ohne return: „missing return statement“.',
    m: 'Jeder mögliche Pfad durch eine Methode mit Rückgabetyp braucht ein `return`.', s: 'Folien EProg Kap. 3.3, Folien 93–95' },

  { id: 'ep3-13', t: 'ep3', d: 1, k: 'sc', fix: true,
    q: 'Was gibt dieser Code aus?',
    code: 'static void plusOne(int x) {\n    x = x + 1;\n}\n\nint x = 6;\nplusOne(x);\nSystem.out.println(x);', out: '6',
    o: ['6', '7', 'Compilerfehler: x doppelt deklariert', '0'], a: 0,
    w: { 1: 'Die Methode bekommt nur eine Kopie des Werts.', 2: 'Parameter und lokale Variable leben in verschiedenen Methoden, ihre Scopes überlappen nicht.' },
    e: 'Primitive Typen werden per Wert übergeben: der Parameter x ist eine neue Variable mit einer Kopie von 6. Die Änderung wirkt nur in `plusOne`.',
    m: 'Wertsemantik: Änderungen am Parameter sieht der Aufrufer nicht.', s: 'Folien EProg Kap. 3.3, Folien 75–78' },

  { id: 'ep3-14', t: 'ep3', d: 2, k: 'sc', fix: true,
    q: 'Wie oft wird `count++` ausgeführt?', code: 'int count = 0;\nfor (int i = 1; i <= 4; i++) {\n    for (int j = i; j <= 4; j++) {\n        count++;\n    }\n}\nSystem.out.println(count);', out: '10',
    o: ['10', '16', '8', '6'], a: 0,
    w: { 1: 'Die innere Schleife startet bei j = i, nicht bei 1.', 3: 'Das wäre bei `j < i` bzw. strikt kleiner der Fall.' },
    e: 'Für i = 1, 2, 3, 4 läuft die innere Schleife 4, 3, 2, 1 mal. Summe 10.',
    m: 'Bei verschachtelten Schleifen pro äusserer Iteration zählen und summieren.', s: 'Folien EProg Kap. 3.2, Folien 45–48' },

  { id: 'ep3-15', t: 'ep3', d: 1, k: 'sc',
    q: 'Welcher Ausdruck ist äquivalent zu `!(x == 7 && y > 3)`?',
    o: ['`x != 7 || y <= 3`', '`x != 7 && y <= 3`', '`x != 7 || y < 3`', '`!x == 7 || !y > 3`'],
    a: 0,
    w: { 1: 'Bei De Morgan wird aus && ein ||.', 2: 'Die Negation von `y > 3` ist `y <= 3`.', 3: '`!x` ist für int nicht erlaubt.' },
    e: 'De Morgan: `!(a && b)` ist `!a || !b`. Die Negation von `x == 7` ist `x != 7`, die von `y > 3` ist `y <= 3`.',
    m: 'Negieren: && ↔ ||, und jeden Vergleich umdrehen (> wird <=).', s: 'Folien EProg Kap. 3.1, Folie 30' },

  { id: 'ep3-16', t: 'ep3', d: 2, k: 'mc',
    q: 'Für welche Jahre liefert `jahr % 4 == 0 && jahr % 100 != 0 || jahr % 400 == 0` den Wert true? Wähle alle.',
    o: ['1900', '2000', '2024', '2100', '2023'], a: [1, 2],
    w: { 0: 'Durch 100, aber nicht durch 400 teilbar.', 1: 'Durch 400 teilbar.', 2: 'Durch 4, nicht durch 100 teilbar.', 3: 'Durch 100, aber nicht durch 400 teilbar.', 4: 'Nicht durch 4 teilbar.' },
    e: '`&&` bindet stärker als `||`. Der Ausdruck heisst also: (durch 4 und nicht durch 100) oder durch 400. Das ist genau die Schaltjahrregel.',
    m: 'Präzedenz: ! vor && vor ||. Trotzdem lieber Klammern setzen.', s: 'Folien EProg Kap. 3.1, Folie 15' },

  { id: 'ep3-17', t: 'ep3', d: 3, k: 'sc',
    q: 'Was passiert?', code: 'for (int i = 0; i < 3; i++);\n{\n    System.out.print(i);\n}', out: '#compile-error',
    o: ['Compilerfehler', 'Ausgabe 012', 'Ausgabe 3', 'Endlosschleife'], a: 0,
    w: { 1: 'Der Strichpunkt beendet die for-Schleife mit einem leeren Rumpf.', 2: 'Das wäre der Fall, wenn i ausserhalb der Schleife deklariert wäre.' },
    e: 'Durch den `;` direkt nach dem Kopf hat die Schleife einen leeren Rumpf. Der folgende Block ist ein eigener Block nach der Schleife, und dort existiert `i` nicht mehr: „cannot find symbol“.',
    m: 'Kein Strichpunkt nach `for (…)` oder `while (…)`.', s: 'Folien EProg Kap. 3.2–3.3 (Scope)' },

  { id: 'ep3-18', t: 'ep3', d: 3, k: 'sc',
    q: 'Was gibt dieser Code aus?',
    code: 'int x = 5;\nif (x > 3)\n    if (x > 10)\n        System.out.println("A");\nelse\n    System.out.println("B");',
    out: 'B',
    o: ['B', 'nichts', 'A', 'A und B'], a: 0,
    w: { 1: 'Das wäre richtig, wenn das else zum äusseren if gehören würde. Die Einrückung täuscht.' },
    e: 'Ohne geschweifte Klammern gehört ein `else` immer zum nächsten offenen `if`, hier also zu `if (x > 10)`. Die Einrückung ist für den Compiler bedeutungslos. 5 > 3 ist wahr, 5 > 10 ist falsch, also wird B ausgegeben.',
    m: 'Immer geschweifte Klammern setzen (siehe „goto fail“).', s: 'Folien EProg Kap. 3.1, Folie 25' },

  { id: 'ep3-19', t: 'ep3', d: 3, k: 'sc',
    q: 'Was gibt dieser Code aus?', code: 'int n = 3;\nSystem.out.println(n > 2 ? 1 : 2.0);', out: '1.0',
    o: ['1.0', '1', '2.0', 'Compilerfehler'], a: 0,
    w: { 1: 'Der Ausdruck hat einen gemeinsamen Typ für beide Zweige.', 3: 'Gemischte Zahlentypen sind erlaubt, sie werden umgewandelt.' },
    e: 'Der ternäre Operator hat einen einzigen Ergebnistyp. Bei int und double wird wie bei arithmetischen Operatoren zum grösseren Typ double umgewandelt. Deshalb wird 1.0 ausgegeben, obwohl der int-Zweig gewählt wurde.',
    m: 'Gemischte Zahlentypen werden zum grösseren Typ umgewandelt, auch im ternären Operator.', s: 'Folien EProg Kap. 3.1, Folie 24, und Kap. 2.3, Folie 104' },

  { id: 'ep3-20', t: 'ep3', d: 2, k: 'sc',
    q: 'Welche Methode gibt für n = 4 genau `1, 2, 3, 4` aus und funktioniert auch für n = 1?',
    o: [
      '`System.out.print(1); for (int i = 2; i <= n; i++) System.out.print(", " + i);`',
      '`for (int i = 1; i <= n; i++) System.out.print(i + ", ");`',
      '`for (int i = 1; i <= n; i++) System.out.print(", " + i);`',
      '`for (int i = 1; i < n; i++) System.out.print(i + ", ");`'
    ], a: 0,
    w: { 1: 'Komma am Ende: `1, 2, 3, 4, `.', 2: 'Komma am Anfang: `, 1, 2, 3, 4`.', 3: 'Die 4 fehlt ganz.' },
    e: 'Zaunpfahlproblem: n Zahlen, aber nur n − 1 Kommas. Lösung: einen „Pfosten“ vor die Schleife ziehen. Für n = 1 läuft die Schleife gar nicht, Ausgabe `1`.',
    m: 'Zaunpfahl: ersten oder letzten Pfosten ausserhalb der Schleife behandeln.', s: 'Folien EProg Kap. 3.4, Folien 128–131' },

  { id: 'ep3-w1', t: 'ep3', d: 2, k: 'w',
    q: 'Was gibt dieser Code aus? Führe eine Tabelle mit i, a, b.',
    code: 'int a = 0, b = 1;\nfor (int i = 0; i < 6; i++) {\n    int t = a + b;\n    a = b;\n    b = t;\n}\nSystem.out.println(a);',
    out: '8', ans: { k: 'num', v: 8 },
    sol: [
      'Start: a = 0, b = 1.',
      'i = 0: t = 1, a = 1, b = 1. i = 1: t = 2, a = 1, b = 2. i = 2: t = 3, a = 2, b = 3.',
      'i = 3: t = 5, a = 3, b = 5. i = 4: t = 8, a = 5, b = 8. i = 5: t = 13, a = 8, b = 13.',
      'Danach ist `i < 6` falsch, ausgegeben wird a.'
    ],
    res: 'Ausgabe: `8` (die Fibonacci-Zahlen tauchen in a auf)',
    m: 'Bei Trace-Aufgaben pro Iteration eine Zeile aufschreiben.', s: 'Folien EProg Kap. 3.2' },

  { id: 'ep3-w2', t: 'ep3', d: 2, k: 'w',
    q: 'Welche Werte haben y und x nach diesem Code? Tippe „y, x“ ein.', code: 'int x = 3;\nint y = x++ * 2 + --x;\nSystem.out.println(y + ", " + x);',
    out: '9, 3', ans: { k: 'vec', v: [9, 3], ph: 'y, x' },
    sol: [
      'Operanden werden von links nach rechts ausgewertet.',
      '`x++` liefert 3, danach ist x = 4. `3 * 2` = 6.',
      '`--x` verringert x auf 3 und liefert 3.',
      'y = 6 + 3 = 9, x = 3.'
    ],
    res: 'y = 9, x = 3',
    m: 'Seiteneffekte in Ausdrücken streng von links nach rechts abarbeiten. Im eigenen Code besser vermeiden.', s: 'Folien EProg Kap. 3.4, Folien 118–125' },

  { id: 'ep3-w3', t: 'ep3', d: 2, k: 'w',
    q: 'Schreibe ein Programmstück, das mit einem `Scanner console` Zahlen einliest, bis **−1** eingegeben wird, und dann die Summe aller Zahlen **ohne** die −1 ausgibt. Vermeide einen Dummy-Startwert für die Variable.',
    hint: 'Das ist ein Zaunpfahlproblem: n-mal einlesen, aber nur (n − 1)-mal addieren.',
    sol: [
      'Ersten Wert vor der Schleife einlesen (erster Pfosten).',
      'In der Schleife: zuerst addieren, dann den nächsten Wert lesen.',
      '`int sum = 0;\nint number = console.nextInt();\nwhile (number != -1) {\n    sum = sum + number;\n    number = console.nextInt();\n}\nSystem.out.println("The total is " + sum);`',
      'So funktioniert der Code für jede Wahl des Sentinels, und −1 wird nie addiert.'
    ],
    res: 'Lesen vor der Schleife, in der Schleife „addieren, dann lesen“.',
    m: 'Sentinel-Schleifen sind Zaunpfahlprobleme.', s: 'Folien EProg Kap. 3.4, Folien 137–146' },

  { id: 'ep3-w4', t: 'ep3', d: 3, k: 'w',
    q: 'Schreibe eine Methode `static boolean isPerfect(int n)`, die prüft, ob n > 1 eine **vollkommene Zahl** ist, also gleich der Summe ihrer Teiler kleiner als n (z. B. 6 = 1 + 2 + 3, 28 = 1 + 2 + 4 + 7 + 14). Wie viele vollkommene Zahlen gibt es von 2 bis 1000?',
    ans: { k: 'num', v: 3 },
    sol: [
      'Teiler d von 1 bis n − 1 durchlaufen und mit `n % d == 0` testen.',
      '`static boolean isPerfect(int n) {\n    int sum = 0;\n    for (int d = 1; d < n; d++) {\n        if (n % d == 0) {\n            sum += d;\n        }\n    }\n    return sum == n;\n}`',
      'Bis 1000 findet man 6, 28 und 496.'
    ],
    res: '3 vollkommene Zahlen: 6, 28, 496',
    m: '`n % d == 0` heisst „d teilt n“.', s: 'Folien EProg Kap. 3.3 (isPrime als Vorlage)' }
]);
