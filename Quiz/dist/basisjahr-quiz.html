<script>
// EProg Teil 2: Kapitel 4 (Strings, Arrays), 5 (Rekursion), 6 (Logisches Schliessen)
QUIZ.add('ep', [
  // ---------------- Kapitel 4: Strings und Arrays ----------------
  { id: 'ep4-01', t: 'ep4', d: 1, k: 'mc',
    q: 'Gegeben `int[] a = {3, 1, 4};` und `String s = "Hallo";`. Welche Ausdrücke kompilieren? Wähle alle.',
    o: ['`a.length`', '`a.length()`', '`s.length()`', '`s.length`'], a: [0, 2],
    w: { 0: 'Arrays haben das Attribut `length`, ohne Klammern.', 1: 'Bei Arrays gibt es keine Methode `length()`.', 2: 'Strings haben die Methode `length()`, mit Klammern.', 3: 'Ein String hat kein öffentliches Attribut `length`.' },
    e: 'Array: Attribut `a.length` ohne Klammern (man kann es nur lesen). String: Methode `s.length()` mit Klammern. Eine Verwechslung gibt einen Compilerfehler.',
    m: 'Array → `length`, String → `length()`. (Bei `ArrayList` heisst es übrigens `size()`.)', s: 'Folien EProg Kap. 4.1, Folie 7, und Kap. 4.2, Folie 36' },

  { id: 'ep4-02', t: 'ep4', d: 1, k: 'sc',
    q: 'Was gibt dieser Code aus?', code: 'String s = "Einfuehrung";\nSystem.out.println(s.substring(2, 5));', out: 'nfu',
    o: ['nfu', 'nfue', 'infu', 'inf'], a: 0,
    w: { 1: 'Der Endindex 5 ist exklusiv.', 2: 'Index 2 ist das dritte Zeichen, nicht das zweite.' },
    e: 'Indizes beginnen bei 0: E0 i1 n2 f3 u4 e5. `substring(2, 5)` nimmt die Zeichen an 2, 3, 4, also „nfu“. Die Länge ist immer Ende minus Anfang = 3.',
    m: '`substring(von, bis)`: von inklusive, bis exklusive.', s: 'Folien EProg Kap. 4.1, Folie 12' },

  { id: 'ep4-03', t: 'ep4', d: 1, k: 'sc',
    q: 'Was gibt dieser Code aus?', code: 'String text = "Hello";\ntext.toUpperCase();\nSystem.out.println(text);', out: 'Hello',
    o: ['Hello', 'HELLO', 'Compilerfehler: Rückgabewert ignoriert', 'hello'], a: 0,
    w: { 1: 'Strings sind unveränderlich, `toUpperCase()` liefert einen neuen String.', 2: 'Rückgabewerte dürfen ignoriert werden, der Compiler warnt nicht.' },
    e: 'Strings sind unveränderlich („immutable“). `toUpperCase()` erzeugt einen neuen String, der hier verworfen wird. Richtig wäre `text = text.toUpperCase();`.',
    m: 'String-Methoden ändern nie den String selbst, das Ergebnis muss man speichern.', s: 'Folien EProg Kap. 4.1, Folie 11' },

  { id: 'ep4-04', t: 'ep4', d: 2, k: 'sc', fix: true,
    q: 'Was gibt dieser Code aus?', code: 'String s = "Mississippi";\nSystem.out.println(s.indexOf("ss", 3));', out: '5',
    o: ['5', '2', '3', '-1'], a: 0,
    w: { 1: 'Ab Index 3 wird gesucht, das erste „ss“ an Index 2 zählt nicht mehr.', 2: 'An Index 3 steht „si“, nicht „ss“.', 3: 'Es gibt ein weiteres „ss“ ab Index 5.' },
    e: 'M0 i1 s2 s3 i4 s5 s6 i7 p8 p9 i10. Die Suche beginnt bei Index 3. Das nächste Vorkommen von „ss“ beginnt bei 5.',
    m: '`indexOf(x, from)` sucht ab `from` (inklusive), −1 heisst nicht gefunden.', s: 'Folien EProg Kap. 4.1, Folie 14' },

  { id: 'ep4-05', t: 'ep4', d: 3, k: 'sc',
    q: 'Was gibt dieser Code aus?', code: 'String s = "AB";\nSystem.out.println(s.charAt(0) + s.charAt(1));', out: '131',
    o: ['131', 'AB', 'A B', 'Compilerfehler'], a: 0,
    w: { 1: '`charAt` liefert `char`, keinen String. Zwei `char` werden addiert.', 3: '`char + char` ist erlaubt und ergibt einen int.' },
    e: '`charAt` liefert den Basistyp `char`. \'A\' hat den Wert 65, \'B\' den Wert 66, Summe 131. `s.substring(0, 1) + s.substring(1, 2)` dagegen würde „AB“ ergeben.',
    m: '`substring(0, 1)` ist ein String, `charAt(0)` ist ein char. Der Unterschied zeigt sich bei `+`.', s: 'Folien EProg Kap. 4.1, Folie 13' },

  { id: 'ep4-06', t: 'ep4', d: 2, k: 'sc',
    q: 'Was passiert?', code: 'String s = "Java";\nSystem.out.println(s.charAt(s.length()));', out: '#exception:StringIndexOutOfBoundsException',
    o: ['Laufzeitfehler: StringIndexOutOfBoundsException', 'Ausgabe a', 'Ausgabe eines leeren Zeichens', 'Compilerfehler'], a: 0,
    w: { 1: 'Das letzte Zeichen steht an `s.length() - 1`.', 3: 'Der Compiler prüft Indizes nicht.' },
    e: 'Gültige Indizes gehen von 0 bis `length() - 1`, hier 0 bis 3. Index 4 existiert nicht. Das merkt erst das Programm zur Laufzeit.',
    m: 'Letztes Zeichen: `s.charAt(s.length() - 1)`.', s: 'Folien EProg Kap. 4.1, Folie 8' },

  { id: 'ep4-07', t: 'ep4', d: 1, k: 'sc',
    q: 'Was gibt dieser Code aus?', code: 'double[] d = new double[3];\nString[] s = new String[2];\nboolean[] b = new boolean[1];\nSystem.out.println(d[1] + " " + s[0] + " " + b[0]);', out: '0.0 null false',
    o: ['0.0 null false', '0 null false', '0.0  false', 'Compilerfehler: nicht initialisiert'], a: 0,
    w: { 1: 'Bei double ist der Standardwert 0.0.', 2: 'Ein String-Element ist null, und das wird als „null“ ausgegeben.', 3: 'Array-Elemente haben im Gegensatz zu lokalen Variablen Standardwerte.' },
    e: '`new` füllt Arrays mit „Null-äquivalenten“ Werten: 0 für int/long, 0.0 für double, false für boolean, null für Referenzen wie String.',
    m: 'Array-Elemente werden vorbelegt, lokale Variablen nicht.', s: 'Folien EProg Kap. 4.2, Folie 25' },

  { id: 'ep4-08', t: 'ep4', d: 1, k: 'sc', fix: true,
    q: 'Was gibt dieser Code aus?', code: 'int[] a = {1, 3};\nint[] b = a;\nb[0]++;\nSystem.out.println(a[0]);', out: '2',
    o: ['2', '1', '3', 'Compilerfehler'], a: 0,
    w: { 1: '`b = a` kopiert nicht das Array, nur die Referenz.' },
    e: 'Arrays haben Referenzsemantik. `int[] b = a;` erzeugt einen Alias: a und b zeigen auf dasselbe Array. Die Änderung über b sieht man auch über a.',
    m: 'Primitive Typen: Wert wird kopiert. Arrays und Objekte: Referenz wird kopiert.', s: 'Folien EProg Kap. 4.2, Folien 41–44' },

  { id: 'ep4-09', t: 'ep4', d: 2, k: 'mc',
    q: 'Gegeben `int[] x = {3, 1, 3};` und `int[] y = {3, 1, 3};`. Welche Ausdrücke sind **true**? Wähle alle.',
    o: ['`x == y`', '`x.equals(y)`', '`Arrays.equals(x, y)`', '`x.length == y.length`', '`Arrays.toString(x).equals(Arrays.toString(y))`'], a: [2, 3, 4],
    w: { 0: '`==` vergleicht Referenzen: zwei verschiedene Arrays.', 1: 'Auch `equals` vergleicht bei Arrays nur die Referenzen.', 2: 'Vergleicht elementweise.', 3: 'Beide haben 3 Elemente.', 4: 'Beide Strings sind „[3, 1, 3]“.' },
    e: 'Für Arrays verhalten sich `==` und `equals` gleich: beide prüfen, ob es dasselbe Objekt ist. Für den inhaltlichen Vergleich gibt es `Arrays.equals`.',
    m: 'Arrays inhaltlich vergleichen: `Arrays.equals(a, b)`.', s: 'Folien EProg Kap. 4.2, Folien 60–63' },

  { id: 'ep4-10', t: 'ep4', d: 2, k: 'sc', fix: true,
    q: 'Was gibt dieser Code aus?', code: 'int[] d = new int[4];\nd[2] = 3;\nint i = 7 % 4;\nd[i] = d[2] - 1;\nd[d[i] - 1] = 9;\nSystem.out.println(d[1] + d[3]);', out: '11',
    o: ['11', '12', '5', '9'], a: 0,
    e: 'Start: {0, 0, 0, 0}. `d[2] = 3`. `i = 3`. `d[3] = 3 - 1 = 2`. `d[d[3] - 1]` ist `d[1] = 9`. Ausgabe: 9 + 2 = 11.',
    m: 'Verschachtelte Indizes von innen nach aussen auswerten und den Zustand mitschreiben.', s: 'Folien EProg Kap. 4.2, Folie 29' },

  { id: 'ep4-11', t: 'ep4', d: 2, k: 'sc',
    q: 'Was gibt dieser Code aus?', code: 'double[] my = {1.1, 1.0, 1.3};\ndouble[] your = {0.2, 0.5};\ndouble[] data = my;\ndata[0] = 7.7;\ndata = your;\ndata[1] = 9.9;\nSystem.out.println(my[0] + " " + your[1] + " " + data.length);', out: '7.7 9.9 2',
    o: ['7.7 9.9 2', '1.1 0.5 3', '7.7 0.5 3', '1.1 9.9 2'], a: 0,
    w: { 1: 'data war ein Alias, Änderungen landen in den Original-Arrays.', 2: '`data = your` hängt die Referenz um, danach zeigt data auf das Array mit Länge 2.' },
    e: 'Zuerst ist data ein Alias von my, also wird my[0] zu 7.7. Dann zeigt data auf your, also wird your[1] zu 9.9. data.length ist jetzt die Länge von your, also 2.',
    m: '`ref = …` hängt den Zeiger um, `ref[i] = …` ändert den Inhalt dahinter.', s: 'Folien EProg Kap. 4.2, Folie 47' },

  { id: 'ep4-12', t: 'ep4', d: 2, k: 'sc',
    q: 'Was gibt dieser Code aus?', code: 'int[][] z = new int[3][4];\nz[1] = new int[2];\nz[1][1] = 5;\nSystem.out.println(z.length + " " + z[1].length + " " + z[2][3]);', out: '3 2 0',
    o: ['3 2 0', '3 4 0', '4 2 0', '3 2 5'], a: 0,
    w: { 1: 'Zeile 1 wurde durch ein neues Array der Länge 2 ersetzt.', 2: '`z.length` ist die Anzahl Zeilen.', 3: 'Die 5 steht in z[1][1], nicht in z[2][3].' },
    e: 'Ein 2D-Array ist ein Array von Arrays. `z.length` = 3 Zeilen. Zeile 1 ist danach ein Array der Länge 2. `z[2][3]` ist noch der Standardwert 0.',
    m: 'Zeilen können verschieden lang sein. Innere Schleife daher bis `z[row].length`.', s: 'Folien EProg Kap. 4.2, Folien 67–72' },

  { id: 'ep4-13', t: 'ep4', d: 2, k: 'sc',
    q: 'Was passiert?', code: 'int[] t;\nt = {1, 2, 3};\nSystem.out.println(t.length);', out: '#compile-error',
    o: ['Compilerfehler', 'Ausgabe 3', 'Ausgabe 0', 'Laufzeitfehler'], a: 0,
    w: { 1: 'Mit `int[] t = {1, 2, 3};` oder `t = new int[]{1, 2, 3};` wäre es 3.' },
    e: 'Die Kurzschreibweise `{…}` ist nur bei der Deklaration erlaubt, nicht in einer späteren Zuweisung.',
    m: 'Direkte Initialisierung mit `{…}` nur zusammen mit der Deklaration.', s: 'Folien EProg Kap. 4.2, Folie 33' },

  { id: 'ep4-14', t: 'ep4', d: 2, k: 'sc',
    q: 'Was gibt dieser Code aus?',
    code: 'static void swap1(int a, int b) {\n    int t = a; a = b; b = t;\n}\nstatic void swap2(int[] d) {\n    int t = d[0]; d[0] = d[1]; d[1] = t;\n}\n\nint x = 1, y = 2;\nint[] p = {1, 2};\nswap1(x, y);\nswap2(p);\nSystem.out.println(x + "" + y + " " + p[0] + p[1]);',
    out: '12 21',
    o: ['12 21', '21 21', '12 12', '3 3'], a: 0,
    w: { 1: 'swap1 bekommt nur Kopien der Werte.', 2: 'swap2 arbeitet über die Referenz auf dem Original-Array.', 3: 'Wegen `""` wird ab dort verkettet, nicht addiert.' },
    e: 'swap1 vertauscht nur seine lokalen Kopien, x und y bleiben 1 und 2. swap2 bekommt eine Referenz und vertauscht im echten Array: p = {2, 1}. Durch `x + ""` wird verkettet.',
    m: 'Methoden können Arrays des Aufrufers verändern (Seiteneffekt), aber keine int-Variablen.', s: 'Folien EProg Kap. 4.2, Folien 40–45' },

  { id: 'ep4-15', t: 'ep4', d: 2, k: 'sc',
    q: 'Was gibt dieser Code aus?', code: 'String s = "Algorithmen";\nSystem.out.println(s.substring(s.indexOf(\'o\'), s.length() - 3));', out: 'orith',
    o: ['orith', 'orithm', 'rith', 'orit'], a: 0,
    e: 'A0 l1 g2 o3 r4 i5 t6 h7 m8 e9 n10, Länge 11. `indexOf(\'o\')` = 3, `s.length() - 3` = 8. `substring(3, 8)` nimmt die Indizes 3 bis 7: „orith“.',
    m: 'Bei substring zählt man am besten die Indizes unter jedem Buchstaben mit.', s: 'Folien EProg Kap. 4.1, Folien 12–15' },

  { id: 'ep4-16', t: 'ep4', d: 2, k: 'sc',
    q: 'Was passiert?', code: 'String s = "abc";\nint count = 0;\nfor (int i = 0; i <= s.length(); i++) {\n    if (s.charAt(i) == \'c\') {\n        count++;\n    }\n}\nSystem.out.println(count);', out: '#exception:StringIndexOutOfBoundsException',
    o: ['StringIndexOutOfBoundsException, keine Ausgabe', 'Ausgabe 1', 'Ausgabe 1, danach Exception', 'Compilerfehler'], a: 0,
    w: { 1: 'Mit `<` statt `<=` wäre das richtig.', 2: 'Die Exception passiert in der Schleife, also vor dem println.' },
    e: 'Off-by-one: die Schleife läuft bis i = 3, aber das letzte gültige Zeichen hat Index 2. `charAt(3)` wirft eine Exception, bevor das println erreicht wird.',
    m: 'Über einen String oder ein Array: `i < length`, nicht `<=`.', s: 'Folien EProg Kap. 4.1, Folie 10' },

  { id: 'ep4-17', t: 'ep4', d: 3, k: 'sc',
    q: 'Was gibt dieser Code aus?', code: 'System.out.println("[" + "Hello".substring(5) + "]");', out: '[]',
    o: ['[]', '[o]', 'StringIndexOutOfBoundsException', '[Hello]'], a: 0,
    w: { 1: 'Index 5 ist bereits hinter dem letzten Zeichen.', 2: '`substring(length())` ist erlaubt und liefert den leeren String. Erst `substring(6)` wäre ein Fehler.' },
    e: '„Hello“ hat Länge 5. `substring(5)` geht von Index 5 bis zum Ende, das ist der leere String. Das ist erlaubt, weil der Startindex bei substring bis `length()` gehen darf. `charAt(5)` wäre dagegen ein Fehler.',
    m: 'substring akzeptiert Grenzen von 0 bis `length()`, charAt nur Indizes bis `length() - 1`.', s: 'Folien EProg Kap. 4.1, Folie 10' },

  { id: 'ep4-18', t: 'ep4', d: 2, k: 'sc',
    q: 'Welche Zeile macht aus `String s = "abc";` den String „xbc“ und speichert ihn in s?',
    o: ['`s = \'x\' + s.substring(1);`', '`s.charAt(0) = \'x\';`', '`s.replace(\'a\', \'x\');`', '`s[0] = \'x\';`'], a: 0,
    w: { 1: 'Compilerfehler: einem Methodenaufruf kann man nichts zuweisen. Strings sind ausserdem unveränderlich.', 2: 'Das Ergebnis wird nicht gespeichert, s bleibt „abc“.', 3: 'Ein String ist kein Array.' },
    e: 'Weil ein Operand ein String ist, verkettet `+`: `\'x\' + "bc"` ergibt „xbc“. Strings selbst kann man nie ändern, nur eine Variable auf einen neuen String zeigen lassen.',
    m: 'Strings sind keine Arrays: kein `s[i]`, keine Zuweisung an `charAt`.', s: 'Folien EProg Kap. 4.1, Folie 5' },

  { id: 'ep4-19', t: 'ep4', d: 2, k: 'sc',
    q: 'Was gibt dieser Code aus?', code: 'int[] a = new int[0];\nint[] b = null;\nSystem.out.println(a.length + " " + (a == null) + " " + (b == null));', out: '0 false true',
    o: ['0 false true', '0 true true', 'NullPointerException', 'Compilerfehler: Länge 0 nicht erlaubt'], a: 0,
    w: { 1: 'Ein leeres Array ist ein echtes Objekt, keine null-Referenz.', 2: '`a.length` ist für ein leeres Array erlaubt.', 3: 'Länge 0 ist erlaubt.' },
    e: '`new int[0]` erzeugt ein echtes Array ohne Elemente. Darauf darf man `length` abfragen. `b` zeigt auf gar kein Array. Erst `b.length` würde eine NullPointerException auslösen.',
    m: 'Leeres Array ≠ null.', s: 'Folien EProg Kap. 4.2, Folien 47–48' },

  { id: 'ep4-20', t: 'ep4', d: 1, k: 'sc',
    q: 'Was gibt dieser Code aus?', code: 'int number = 6;\nString s = "" + number + 7;\nSystem.out.println(s + 1);', out: '671',
    o: ['671', '14', '68', '131'], a: 0,
    e: '`"" + 6` ist „6“, `+ 7` ergibt „67“, `+ 1` ergibt „671“. Ein leerer String am Anfang ist ein bekannter Trick, um in einen String umzuwandeln.',
    m: '`"" + x` macht aus x einen String.', s: 'Folien EProg Kap. 4.1, Folie 4' },

  { id: 'ep4-21', t: 'ep4', d: 2, k: 'sc',
    q: '`int[][] table = {{1, 2}, {3, 4}};` Welche Anweisung gibt `[[1, 2], [3, 4]]` aus?',
    o: ['`System.out.println(Arrays.deepToString(table));`', '`System.out.println(Arrays.toString(table));`', '`System.out.println(table);`', '`System.out.println(table.toString());`'], a: 0,
    w: { 1: 'Gibt die Referenzen der Zeilen aus, etwa `[[I@156643d4, [I@123a439b]`.', 2: 'Gibt nur etwas wie `[[I@156643d4` aus.', 3: 'Dasselbe wie `println(table)`.' },
    e: '`Arrays.toString` geht nur eine Ebene tief. Für verschachtelte Arrays gibt es `Arrays.deepToString`.',
    m: '2D-Arrays ausgeben: `Arrays.deepToString`.', s: 'Folien EProg Kap. 4.2, Folie 72' },

  { id: 'ep4-w1', t: 'ep4', d: 3, k: 'w',
    q: 'Was gibt dieses Programm aus? Zeichne die Referenzen nach jeder Zeile.',
    code: 'static void f(int[] a, int x) {\n    a[0] = a[0] + x;\n    x = x * 2;\n    a = new int[2];\n    a[1] = 7;\n}\n\nint[] arr = {1, 2};\nint x = 5;\nf(arr, x);\nSystem.out.println(arr[0] + " " + arr[1] + " " + x);',
    out: '6 2 5', ans: { k: 'str', v: ['6 2 5'], ph: 'Ausgabe' },
    sol: [
      'Beim Aufruf zeigt der Parameter `a` auf dasselbe Array wie `arr`, und `x` ist eine Kopie von 5.',
      '`a[0] = 1 + 5 = 6` ändert das gemeinsame Array: arr = {6, 2}.',
      '`x = 10` ändert nur die Kopie in f.',
      '`a = new int[2]` hängt nur den Parameter auf ein neues Array um. `a[1] = 7` landet in diesem neuen Array, arr bleibt {6, 2}.',
      'In main: arr = {6, 2}, x = 5.'
    ],
    res: 'Ausgabe: `6 2 5`',
    m: 'Über die Referenz ändern wirkt nach aussen, die Referenz umhängen nicht.', s: 'Folien EProg Kap. 4.2, Folien 45–47' },

  { id: 'ep4-w2', t: 'ep4', d: 2, k: 'w',
    q: 'Schreibe eine Methode `static void reverse(int[] a)`, die das Array **an Ort und Stelle** umdreht (ohne neues Array). Für `{1, 2, 3, 4, 5}` soll danach `{5, 4, 3, 2, 1}` drinstehen.',
    hint: 'Vertausche das erste mit dem letzten Element, das zweite mit dem zweitletzten, … bis zur Mitte.',
    sol: [
      'Nur bis zur Mitte laufen, sonst vertauscht man alles zweimal zurück.',
      '```\nstatic void reverse(int[] a) {\n    for (int i = 0; i < a.length / 2; i++) {\n        int t = a[i];\n        a[i] = a[a.length - 1 - i];\n        a[a.length - 1 - i] = t;\n    }\n}\n```',
      'Kein Rückgabewert nötig: der Aufrufer sieht die Änderung über die Referenz. Bei ungerader Länge bleibt das mittlere Element stehen. Leeres Array: keine Iteration.'
    ],
    res: 'Schleife bis `a.length / 2`, Partner-Index `a.length - 1 - i`.',
    m: 'Die Grenze `a.length / 2` verhindert das doppelte Vertauschen.', s: 'Folien EProg Kap. 4.2, Folie 53' },

  { id: 'ep4-w3', t: 'ep4', d: 1, k: 'w',
    q: 'Schreibe eine Methode `static boolean isPalindrome(String s)`, die prüft, ob s vorwärts und rückwärts gleich ist (Gross-/Kleinschreibung beachten). Beispiele: „otto“ → true, „Otto“ → false, „“ → true.',
    sol: [
      'Vergleiche Zeichen an Index i mit dem an `s.length() - 1 - i`.',
      '```\nstatic boolean isPalindrome(String s) {\n    for (int i = 0; i < s.length() / 2; i++) {\n        if (s.charAt(i) != s.charAt(s.length() - 1 - i)) {\n            return false;\n        }\n    }\n    return true;\n}\n```',
      'Einzelne `char` darf man mit `!=` vergleichen, weil char ein Basistyp ist. Beim leeren String läuft die Schleife nicht und das Ergebnis ist true.'
    ],
    res: 'Früher Abbruch mit `return false`, am Ende `return true`.',
    m: '`char` mit `==` vergleichen ist korrekt, Strings dagegen mit `equals`.', s: 'Folien EProg Kap. 4.1' },

  { id: 'ep4-w4', t: 'ep4', d: 2, k: 'w',
    q: 'Schreibe `static int[] positives(int[] a)`, das ein **neues** Array mit allen positiven Elementen von a zurückgibt, in derselben Reihenfolge und mit **genau passender Länge**. Beispiel: `{3, -1, 0, 7}` → `{3, 7}`.',
    hint: 'Die Länge des Ergebnisses kennst du erst, wenn du gezählt hast. Also zwei Durchläufe.',
    sol: [
      'Erster Durchlauf: positive Elemente zählen.',
      'Neues Array dieser Länge anlegen.',
      'Zweiter Durchlauf mit separatem Schreibindex `k`.',
      '```\nstatic int[] positives(int[] a) {\n    int count = 0;\n    for (int i = 0; i < a.length; i++) {\n        if (a[i] > 0) count++;\n    }\n    int[] result = new int[count];\n    int k = 0;\n    for (int i = 0; i < a.length; i++) {\n        if (a[i] > 0) {\n            result[k] = a[i];\n            k++;\n        }\n    }\n    return result;\n}\n```'
    ],
    res: 'Zählen, Array anlegen, mit eigenem Schreibindex kopieren.',
    m: 'Arrays können ihre Grösse nicht ändern, daher zuerst zählen.', s: 'Folien EProg Kap. 4.2, Folien 56–59' },

  // ---------------- Kapitel 5: Rekursion ----------------
  { id: 'ep5-01', t: 'ep5', d: 1, k: 'sc',
    q: 'Was passiert beim Aufruf `f(3)`?', code: 'static void f(int x) {\n    System.out.println(x);\n    f(x - 1);\n}',
    o: ['Endlos viele Ausgaben, bis ein StackOverflowError kommt', 'Ausgabe 3 2 1 0', 'Compilerfehler: kein Basisfall', 'Ausgabe 3, dann Ende'], a: 0,
    w: { 1: 'Nichts stoppt die Rekursion bei 0.', 2: 'Der Compiler prüft nicht, ob eine Rekursion terminiert.' },
    e: 'Es fehlt ein Basisfall, also ein Weg durch die Methode ohne rekursiven Aufruf. Jeder Aufruf legt einen neuen Eintrag auf den Aufrufstapel, bis dieser voll ist.',
    m: 'Jede Rekursion braucht einen Basisfall, der sicher erreicht wird.', s: 'Folien EProg Kap. 5.1, Folien 4–7 und 23' },

  { id: 'ep5-02', t: 'ep5', d: 1, k: 'sc',
    q: 'Was gibt dieser Code aus?', code: 'static String r(String s) {\n    if (s.length() <= 1) return s;\n    return r(s.substring(1)) + s.charAt(0);\n}\n\nSystem.out.println(r("EProg"));', out: 'gorPE',
    o: ['gorPE', 'EProg', 'gorP', 'PEgor'], a: 0,
    e: 'r kehrt den String um: der Rest ohne erstes Zeichen wird rekursiv umgedreht und das erste Zeichen hinten angehängt. r("EProg") = r("Prog") + E = … = "gorPE".',
    m: 'Rekursive Idee: Wenn ich das kleinere Problem lösen kann, kann ich auch das grössere lösen.', s: 'Folien EProg Kap. 5.1, Folien 9–10' },

  { id: 'ep5-03', t: 'ep5', d: 2, k: 'sc',
    q: 'Was gibt `p(3)` aus?', code: 'static void p(int n) {\n    if (n == 0) return;\n    System.out.print(n);\n    p(n - 1);\n    System.out.print(n);\n}\n\np(3);', out: '321123',
    o: ['321123', '321321', '123321', '3210123'], a: 0,
    w: { 1: 'Die zweite Ausgabe passiert erst, wenn der innere Aufruf fertig ist, also in umgekehrter Reihenfolge.', 3: 'Bei n == 0 wird nichts ausgegeben.' },
    e: 'Vor dem rekursiven Aufruf wird absteigend ausgegeben (3, 2, 1). Nach der Rückkehr werden die Aufrufe vom Stapel genommen, innerster zuerst: 1, 2, 3.',
    m: 'Code nach dem rekursiven Aufruf läuft in umgekehrter Reihenfolge.', s: 'Folien EProg Kap. 5.1, Folie 7 (Aufrufstapel)' },

  { id: 'ep5-04', t: 'ep5', d: 2, k: 'sc', fix: true,
    q: 'Was gibt dieser Code aus?', code: 'static int m(String s) {\n    if (s.length() == 0) return 0;\n    int rest = m(s.substring(1));\n    return s.charAt(0) == \'a\' ? rest + 1 : rest - 1;\n}\n\nSystem.out.println(m("banana"));', out: '0',
    o: ['0', '3', '-3', '6'], a: 0,
    e: 'm zählt +1 für jedes a und −1 für jedes andere Zeichen. „banana“ hat 3 a und 3 andere Zeichen, also 3 − 3 = 0.',
    m: 'Oft hilft es, zuerst zu verstehen, was die Methode für kurze Eingaben berechnet.', s: 'Folien EProg Kap. 5.1, Folie 8' },

  { id: 'ep5-05', t: 'ep5', d: 2, k: 'sc',
    q: 'Was passiert bei `f(5)`?', code: 'static int f(int n) {\n    if (n == 0) return 0;\n    return f(n - 2) + 1;\n}\n\nSystem.out.println(f(5));', out: '#exception:StackOverflowError',
    o: ['StackOverflowError', 'Ausgabe 3', 'Ausgabe 2', 'Compilerfehler'], a: 0,
    w: { 1: 'n läuft 5, 3, 1, −1, … und trifft 0 nie.', 2: 'Das wäre bei f(4) die Ausgabe.' },
    e: 'Der Basisfall `n == 0` wird bei ungeradem Start nie erreicht: 5, 3, 1, −1, −3, … Die Rekursion endet erst, wenn der Aufrufstapel überläuft. Mit `n <= 0` wäre es sicher.',
    m: 'Basisfall lieber mit `<=` als mit `==` formulieren.', s: 'Folien EProg Kap. 5.1, Folie 4' },

  { id: 'ep5-06', t: 'ep5', d: 2, k: 'sc', fix: true,
    q: 'Wie viele Zeilen gibt `bitstrings("1", 3)` aus?', code: 'static void bitstrings(String prefix, int n) {\n    if (prefix.length() == n) {\n        System.out.println(prefix);\n    } else {\n        bitstrings(prefix + \'0\', n);\n        bitstrings(prefix + \'1\', n);\n    }\n}',
    o: ['4', '8', '3', '2'], a: 0,
    w: { 1: 'Das wäre mit leerem Präfix der Fall.' },
    e: 'Das Präfix „1“ ist schon fest, es fehlen 2 Stellen. Jede wird mit 0 und 1 belegt: $2^2 = 4$ Zeilen (100, 101, 110, 111).',
    m: 'Zwei rekursive Aufrufe pro Ebene → Baum mit $2^k$ Blättern.', s: 'Folien EProg Kap. 5.1, Folien 11–12' },

  { id: 'ep5-07', t: 'ep5', d: 3, k: 'sc', fix: true,
    q: 'Wie viele Aufrufe von `power` (inklusive dem ersten) löst `power(2, 8)` aus?', code: 'static int power(int b, int p) {\n    if (p == 0) {\n        return 1;\n    } else if (p == 1) {\n        return b;\n    } else {\n        return power(b, p / 2) * power(b, p - p / 2);\n    }\n}',
    o: ['15', '8', '4', '9'], a: 0,
    w: { 2: 'Das wäre der Fall, wenn man das Ergebnis von `power(b, p / 2)` wiederverwenden würde.', 3: 'Das wäre bei Decrease and Conquer mit p − 1 der Fall.' },
    e: 'Aufrufbaum: 8 → zwei Aufrufe mit 4 → vier mit 2 → acht mit 1 (Basisfall). Total 1 + 2 + 4 + 8 = 15. Divide and Conquer spart hier nichts, weil beide Hälften gleich sind und doppelt berechnet werden.',
    m: 'Gleiche Teilprobleme mehrfach lösen ist ineffizient. Abhilfe: Ergebnis wiederverwenden (dynamische Programmierung).', s: 'Folien EProg Kap. 5.2, Folie 21' },

  { id: 'ep5-08', t: 'ep5', d: 3, k: 'sc',
    q: 'Welchen Wert liefert `g(4)`, und wie viele Aufrufe von g (inklusive dem ersten) gibt es dabei?', code: 'static int g(int n) {\n    if (n <= 1) return n;\n    return g(n - 1) + g(n - 2);\n}',
    o: ['Wert 3, 9 Aufrufe', 'Wert 3, 5 Aufrufe', 'Wert 5, 9 Aufrufe', 'Wert 4, 7 Aufrufe'], a: 0,
    w: { 1: 'g(2) wird zweimal, g(1) dreimal berechnet.', 2: 'g(5) wäre 5.' },
    e: 'Werte: g(0) = 0, g(1) = 1, g(2) = 1, g(3) = 2, g(4) = 3. Aufrufe: A(0) = A(1) = 1 und A(n) = 1 + A(n−1) + A(n−2). Also A(2) = 3, A(3) = 5, A(4) = 9.',
    m: 'Die naive Fibonacci-Rekursion braucht exponentiell viele Aufrufe.', s: 'Folien EProg Kap. 5.2, Folie 24' },

  { id: 'ep5-09', t: 'ep5', d: 1, k: 'sc',
    q: 'Welche Lösungsstrategie verwendet eine Methode, die einen String in zwei gleich grosse Hälften teilt und für beide Hälften rekursiv aufgerufen wird?',
    o: ['Divide and Conquer', 'Decrease and Conquer', 'Iteration', 'Dynamische Programmierung'], a: 0,
    w: { 1: 'Decrease and Conquer verkleinert das Problem um eins und macht einen rekursiven Aufruf.' },
    e: 'Divide and Conquer zerlegt das Problem in zwei (etwa) gleich grosse Teilprobleme, delegiert beide und kombiniert die Ergebnisse.',
    m: 'n − 1 → Decrease and Conquer, n / 2 und n / 2 → Divide and Conquer.', s: 'Folien EProg Kap. 5.2, Folien 14–22' },

  { id: 'ep5-w1', t: 'ep5', d: 2, k: 'w',
    q: 'Was gibt `t(13)` aus? Schreib den Aufrufstapel auf.', code: 'static void t(int n) {\n    if (n > 0) {\n        t(n / 2);\n        System.out.print(n % 2);\n    }\n}\n\nt(13);',
    out: '1101', ans: { k: 'str', v: ['1101'], ph: 'Ausgabe' },
    sol: [
      'Aufrufe: t(13) → t(6) → t(3) → t(1) → t(0) (macht nichts).',
      'Beim Zurückkehren wird in umgekehrter Reihenfolge ausgegeben: t(1) gibt 1 aus, t(3) gibt 1, t(6) gibt 0, t(13) gibt 1.',
      'Das ist genau die Binärdarstellung von 13.'
    ],
    res: 'Ausgabe: `1101`',
    m: 'Ausgabe nach dem rekursiven Aufruf → umgekehrte Reihenfolge.', s: 'Folien EProg Kap. 5.1' },

  { id: 'ep5-w2', t: 'ep5', d: 1, k: 'w',
    q: 'Schreibe eine **rekursive** Methode `static int sumDigits(int n)` für n ≥ 0, die die Quersumme berechnet. Was liefert `sumDigits(90210)`?',
    ans: { k: 'num', v: 12 },
    sol: [
      'Basisfall: n < 10, dann ist n selbst die Quersumme.',
      'Rekursiver Fall: letzte Ziffer `n % 10` plus Quersumme vom Rest `n / 10`.',
      '```\nstatic int sumDigits(int n) {\n    if (n < 10) {\n        return n;\n    }\n    return n % 10 + sumDigits(n / 10);\n}\n```',
      '9 + 0 + 2 + 1 + 0 = 12.'
    ],
    res: '`sumDigits(90210)` = 12',
    m: '`% 10` liefert die letzte Ziffer, `/ 10` entfernt sie.', s: 'Folien EProg Kap. 5.1 und Kap. 2.3, Folie 90' },

  { id: 'ep5-w3', t: 'ep5', d: 3, k: 'w',
    q: 'Wie viele Wörter der Länge 5 über {a, b} gibt es, in denen **nie zwei b direkt nebeneinander** stehen? Schreibe eine rekursive Methode `static int count(String prefix, int n)` nach dem Muster von `bitstrings`, die solche Wörter zählt.',
    ans: { k: 'num', v: 13 },
    hint: 'Ein b darf man nur anhängen, wenn das Präfix nicht schon auf b endet.',
    sol: [
      'Basisfall: Präfix hat Länge n → ein gültiges Wort, Rückgabe 1.',
      'Sonst: immer `prefix + \'a\'` weiterzählen, `prefix + \'b\'` nur, wenn prefix nicht mit b endet.',
      '```\nstatic int count(String prefix, int n) {\n    if (prefix.length() == n) {\n        return 1;\n    }\n    int c = count(prefix + \'a\', n);\n    if (!prefix.endsWith("b")) {\n        c += count(prefix + \'b\', n);\n    }\n    return c;\n}\n```',
      'Für Länge 1 bis 5 ergibt sich 2, 3, 5, 8, 13: jedes Mal die Summe der beiden vorherigen (Fibonacci).'
    ],
    res: '13 Wörter für n = 5',
    m: 'Rekursives Aufzählen mit Präfix: Bedingung prüfen, bevor man verzweigt.', s: 'Folien EProg Kap. 5.1, Folien 11–12' },

  // ---------------- Kapitel 6: Logisches Schliessen ----------------
  { id: 'ep6-01', t: 'ep6', d: 1, k: 'sc',
    q: 'Ist das Hoare-Tripel `{b > 5} a = b + 25; {a > 30}` gültig?',
    o: ['Ja, denn aus b > 5 folgt b + 25 > 30', 'Nein, Gegenbeispiel b = 6', 'Nein, wegen möglichem int-Überlauf', 'Das lässt sich ohne konkrete Werte nicht entscheiden'], a: 0,
    w: { 1: 'Für b = 6 ist a = 31 > 30.', 2: 'In Aussagen rechnen wir mit mathematischen Zahlen ohne Überlauf.' },
    e: 'Zuweisungsregel: Q\' entsteht, indem man a in Q durch b + 25 ersetzt: `b + 25 > 30`, also `b > 5`. Die Vorbedingung impliziert Q\', also ist das Tripel gültig.',
    m: 'Zuweisungsregel: in der Nachbedingung X durch E ersetzen, dann P ⟹ Q\' zeigen.', s: 'Folien EProg Kap. 6.3, Folie 26' },

  { id: 'ep6-02', t: 'ep6', d: 2, k: 'sc',
    q: 'Ist `{v ≠ 1} w = v * v; {w ≠ v}` gültig?',
    o: ['Nein, Gegenbeispiel v = 0', 'Ja, weil v ≠ 1', 'Nein, Gegenbeispiel v = −1', 'Ja, weil v² > v für alle v'], a: 0,
    w: { 1: 'v = 1 ist ausgeschlossen, v = 0 aber nicht.', 2: 'Für v = −1 ist w = 1 ≠ −1, die Nachbedingung gilt.', 3: 'Für 0 < v < 1 und v = 0 stimmt das nicht.' },
    e: 'Q\' ist `v * v ≠ v`, also v(v − 1) ≠ 0, also v ≠ 0 und v ≠ 1. Die Vorbedingung schliesst nur v = 1 aus. Für v = 0 gilt die Vorbedingung, aber w = 0 = v.',
    m: 'Ungültigkeit zeigt man mit einem Gegenbeispiel, das P erfüllt, aber Q verletzt.', s: 'Folien EProg Kap. 6.3, Folie 28' },

  { id: 'ep6-03', t: 'ep6', d: 2, k: 'sc',
    q: 'Was ist die schwächste Vorbedingung von `x = x + 1; y = 2 * x;` bezüglich der Nachbedingung `{y > 10}`? (Ganze Zahlen)',
    o: ['x > 4', 'x > 5', 'x ≥ 4', 'y > 10'], a: 0,
    w: { 1: 'Das ist hinreichend, aber stärker als nötig (x = 5 funktioniert auch).', 2: 'Für x = 4 ist y = 10, nicht > 10.', 3: 'y wird überschrieben, sein Anfangswert ist egal.' },
    e: 'Rückwärts: vor `y = 2 * x` muss `2x > 10` gelten. Vor `x = x + 1` muss `2(x + 1) > 10` gelten, also `x + 1 > 5`, also `x > 4`.',
    m: 'Rückwärtsschliessen: von der letzten Anweisung zur ersten ersetzen.', s: 'Folien EProg Kap. 6.1, Folien 10–12' },

  { id: 'ep6-04', t: 'ep6', d: 1, k: 'sc',
    q: 'Es gelte P₁ ⟹ P₂. Welche Aussage stimmt?',
    o: ['P₁ ist stärker als P₂', 'P₁ ist schwächer als P₂', 'P₁ und P₂ sind äquivalent', 'P₂ ist stärker als P₁'], a: 0,
    e: 'Die stärkere Aussage verlangt mehr und impliziert die schwächere. Beispiel: `a > 0 ∧ b > 0` ist stärker als `a + b > 0`.',
    m: 'Wer Code nutzt, will eine schwache Vorbedingung und eine starke Nachbedingung.', s: 'Folien EProg Kap. 6.3, Folien 30–32' },

  { id: 'ep6-05', t: 'ep6', d: 2, k: 'sc',
    q: 'Ist dieses Tripel gültig?\n`{x == 7 ∧ y == 5} t = x; y = x; x = t; {y == 7 ∧ x == 5}`',
    o: ['Nein, am Ende ist x == 7', 'Ja, die Werte werden vertauscht', 'Nein, am Ende ist y == 5', 'Ja, aber nur bei x ≠ y'], a: 0,
    w: { 1: 'Für einen Tausch müsste es `t = x; x = y; y = t;` heissen.', 2: 'y wird 7.' },
    e: 'Nach `t = x` ist t = 7, nach `y = x` ist y = 7, nach `x = t` ist x = 7. Der Wert 5 geht verloren. Rückwärts: Q\' wird `x == 7 ∧ x == 5`, das ist unerfüllbar.',
    m: 'Bei Zuweisungsfolgen hilft rückwärts ersetzen oder eine Wertetabelle.', s: 'Folien EProg Kap. 6.4, Folie 42' },

  { id: 'ep6-06', t: 'ep6', d: 2, k: 'sc',
    q: 'Ist `{z != 0 && y % z == 0} x = y / z; {y == x * z}` gültig? (Ganzzahldivision)',
    o: ['Ja', 'Nein, wegen Ganzzahldivision', 'Nein, Gegenbeispiel z = −1', 'Nur für positive y'], a: 0,
    w: { 1: 'Weil z ein Teiler von y ist, geht die Division ohne Rest auf.' },
    e: 'Q\' ist `y == (y / z) * z`. Wenn z ≠ 0 und z teilt y, ist die Division exakt, also gilt Q\'. Ohne `y % z == 0` wäre das Tripel ungültig (y = 5, z = 2).',
    m: 'In Aussagen bleibt `/` die ganzzahlige Division.', s: 'Folien EProg Kap. 6.3, Folie 34' },

  { id: 'ep6-07', t: 'ep6', d: 3, k: 'sc',
    q: 'Ist dieses Tripel gültig?\n`{x > 0} if (x % 2 == 1) { y = x + 1; } else { y = x - 1; } {y % 2 == 0}`',
    o: ['Nein, der else-Zweig liefert ein ungerades y', 'Ja, beide Zweige machen y gerade', 'Nein, der if-Zweig liefert ein ungerades y', 'Ja, aber nur für x > 1'], a: 0,
    w: { 1: 'Für gerades x ist x − 1 ungerade.', 2: 'Für ungerades x ist x + 1 gerade.' },
    e: 'if-Regel: Zu zeigen sind `{x > 0 ∧ x % 2 == 1} y = x + 1 {y % 2 == 0}` (gilt) und `{x > 0 ∧ x % 2 != 1} y = x - 1 {y % 2 == 0}`. Der zweite Teil scheitert: für x = 2 ist y = 1.',
    m: 'if-Regel: beide Zweige getrennt prüfen, je mit P ∧ b bzw. P ∧ ¬b.', s: 'Folien EProg Kap. 6.5, Folien 45 und 50' },

  { id: 'ep6-08', t: 'ep6', d: 2, k: 'sc',
    q: 'Ist `{x ≠ 0} if (0 < y) { x = x + y; } {x ≠ 0}` gültig?',
    o: ['Nein, z. B. x = −2, y = 2', 'Ja, weil y > 0', 'Nein, z. B. x = 1, y = 0', 'Ja, ohne else bleibt x unverändert'], a: 0,
    w: { 1: 'Ein positives y kann ein negatives x genau auf 0 bringen.', 2: 'Für y = 0 läuft der leere else-Zweig, x bleibt 1 ≠ 0.' },
    e: 'Fehlender else-Zweig entspricht einem leeren else, dort ist alles gut. Im if-Zweig muss `x ≠ 0 ∧ 0 < y ⟹ x + y ≠ 0` gelten. Das stimmt nicht für x = −2, y = 2.',
    m: 'Ein fehlender else-Zweig ist ein leerer else-Zweig, er muss trotzdem geprüft werden.', s: 'Folien EProg Kap. 6.5, Folien 48–49' },

  { id: 'ep6-09', t: 'ep6', d: 2, k: 'mc',
    q: 'Code der Form `{P} init; while (b) { S } {Q}` mit Invariante I. Was muss man für die **partielle** Korrektheit zeigen? Wähle alle.',
    o: ['`{P} init {I}`', '`{I ∧ b} S {I}`', '`I ∧ ¬b ⟹ Q`', '`{I} S {I ∧ ¬b}`', 'dass die Schleife terminiert'], a: [0, 1, 2],
    w: { 0: 'Die Invariante muss vor der Schleife gelten.', 1: 'Der Rumpf muss sie erhalten.', 2: 'Nach der Schleife muss daraus Q folgen.', 3: 'Der Rumpf muss b nicht falsch machen, das passiert erst irgendwann.', 4: 'Terminierung gehört zur totalen Korrektheit.' },
    e: 'Die while-Regel: Gilt I vor der Schleife und erhält jeder Durchlauf I, dann gilt nach der Schleife I ∧ ¬b. Daraus muss die Nachbedingung folgen.',
    m: 'Invariante: etabliert, erhalten, stark genug.', s: 'Folien EProg Kap. 6.6, Folien 61–63' },

  { id: 'ep6-10', t: 'ep6', d: 2, k: 'sc',
    q: 'Welche Aussage ist eine nützliche Invariante für diese Schleife?\n`{x >= 0} y = 0; i = 1; while (i != x + 1) { y = y + i; i = i + 1; } {y == sum(1, x)}`',
    o: ['`y == sum(1, i - 1)`', '`y == sum(1, i)`', '`y == sum(1, x)`', '`i >= 1`'], a: 0,
    w: { 1: 'Vor der Schleife ist y = 0, aber sum(1, 1) = 1.', 2: 'Gilt vor der Schleife nicht (ausser für x = 0).', 3: 'Wahr und erhalten, aber zu schwach für die Nachbedingung.' },
    e: 'Weil i erst nach dem Addieren erhöht wird, enthält y die Summe bis i − 1. Vor der Schleife: 0 == sum(1, 0). Am Ende gilt i == x + 1, also y == sum(1, x).',
    m: 'Die Invariante hängt von der Reihenfolge der Anweisungen im Rumpf ab.', s: 'Folien EProg Kap. 6.6, Folien 68–70' },

  { id: 'ep6-11', t: 'ep6', d: 3, k: 'sc',
    q: '`{x > 0 ∧ y ≥ 0} r = x; q = 0; while (r >= y) { r = r - y; q = q + 1; } {q == x / y}` mit Invariante `q * y + r == x ∧ 0 ≤ r`. Was stimmt?',
    o: ['Das Tripel ist partiell korrekt, aber für y = 0 terminiert die Schleife nicht', 'Das Tripel ist total korrekt', 'Das Tripel ist ungültig, weil die Invariante für y = 0 nicht gilt', 'Das Tripel ist ungültig, weil x / y für y = 0 eine Exception wirft'], a: 0,
    w: { 1: 'Für y = 0 läuft die Schleife ewig.', 2: 'Die Invariante bleibt für y = 0 erhalten: r ändert sich nicht.', 3: 'Hoare-Tripel sagen nichts über Zustände, die nie erreicht werden.' },
    e: 'Hoare-Tripel drücken partielle Korrektheit aus: wenn das Programm endet, gilt Q. Für y = 0 endet es nie, also ist das Tripel trotzdem gültig. Für totale Korrektheit braucht es y > 0 und einen Terminierungsbeweis (r wird kleiner und ist nach unten beschränkt).',
    m: 'Partiell korrekt = korrekt, falls es terminiert.', s: 'Folien EProg Kap. 6.6, Folien 81–82' },

  { id: 'ep6-12', t: 'ep6', d: 2, k: 'sc',
    q: 'Welche Invariante beweist `{n ≥ 0} i = 0; s = 0; while (i != n) { s = s + 2 * i + 1; i = i + 1; } {s == n * n}`?',
    o: ['`s == i * i`', '`s == n * n`', '`s >= 0`', '`s == (i + 1) * (i + 1)`'], a: 0,
    w: { 1: 'Gilt vor der Schleife nur für n = 0.', 2: 'Gilt, ist aber zu schwach.', 3: 'Gilt vor der Schleife nicht (0 ≠ 1).' },
    e: 'Vorher: 0 == 0·0. Rumpf: aus s == i² folgt s + 2i + 1 == (i + 1)², also gilt die Invariante für das neue i. Am Ende: i == n, also s == n².',
    m: 'Eine gute Invariante sieht aus wie die Nachbedingung, mit der Laufvariable statt n.', s: 'Folien EProg Kap. 6.6, Folien 64–67' },

  { id: 'ep6-13', t: 'ep6', d: 3, k: 'tf',
    q: 'Entscheide für jede Aussage über Hoare-Tripel (partielle Korrektheit).',
    rows: [
      ['`{false} S {Q}` ist für jedes S und jedes Q gültig.', true, 'Es gibt keinen Zustand, in dem die Vorbedingung gilt.'],
      ['`{P} S {true}` ist für jedes P und S gültig.', true, 'true gilt in jedem Zustand nach S.'],
      ['Ist `{P} S {Q}` gültig und P\' ⟹ P, dann ist auch `{P\'} S {Q}` gültig.', true, 'Eine stärkere Vorbedingung schadet nie.'],
      ['Ist `{P} S {Q}` gültig und Q ⟹ Q\', dann ist auch `{P} S {Q\'}` gültig.', true, 'Eine schwächere Nachbedingung folgt immer.'],
      ['Ist `{P} S {Q}` gültig, dann ist auch `{P} S {P ∧ Q}` gültig.', false, 'S kann P zerstören: `{x == 1} x = 2; {x == 2}` ist gültig, aber `{x == 1} x = 2; {x == 1 ∧ x == 2}` nicht.']
    ],
    e: 'Vorbedingungen darf man verstärken, Nachbedingungen abschwächen.', m: 'Stärkere Vorbedingung oder schwächere Nachbedingung erhalten die Gültigkeit.', s: 'Folien EProg Kap. 6.2–6.4' },

  { id: 'ep6-w1', t: 'ep6', d: 2, k: 'w',
    q: 'Bestimme durch Rückwärtsschliessen die schwächste Vorbedingung P und vereinfache sie so weit wie möglich:\n`{P} x = 2 * x - y; y = x + 3; {x > y - 5 ∧ y < 10}`',
    ans: { k: 'str', v: ['2x-y<7', '2*x-y<7', 'y>2x-7', 'y>2*x-7', '2x<y+7', '2*x<y+7', '7>2x-y', '7>2*x-y'], ph: 'z. B. 3x + y > 2', note: 'Ohne Leerzeichen geprüft, `*` darf fehlen.' },
    sol: [
      'Vor `y = x + 3`: y ersetzen: `x > (x + 3) - 5 ∧ x + 3 < 10`.',
      'Vereinfachen: `x > x - 2` ist immer wahr, bleibt `x < 7`.',
      'Vor `x = 2 * x - y`: x ersetzen: `2x - y < 7`.'
    ],
    res: 'P: `2x − y < 7`',
    m: 'Nach jedem Ersetzen vereinfachen, dann bleibt die Aussage überschaubar.', s: 'Folien EProg Kap. 6.3–6.4' },

  { id: 'ep6-w2', t: 'ep6', d: 2, k: 'w',
    q: 'Zeige mit der if-Regel, dass dieses Tripel gültig ist:\n`{true} if (a > b) { m = a; } else { m = b; } {m ≥ a ∧ m ≥ b}`',
    sol: [
      'if-Zweig: Q\' durch Ersetzen von m durch a: `a ≥ a ∧ a ≥ b`. Zu zeigen: `true ∧ a > b ⟹ a ≥ a ∧ a ≥ b`. Stimmt, weil a > b ⟹ a ≥ b.',
      'else-Zweig: Q\' ist `b ≥ a ∧ b ≥ b`. Zu zeigen: `true ∧ ¬(a > b) ⟹ b ≥ a ∧ b ≥ b`. Stimmt, weil ¬(a > b) heisst a ≤ b.',
      'Beide Implikationen gelten, also ist das Tripel gültig.'
    ],
    res: 'Gültig: beide Zweige erfüllen die Nachbedingung.',
    m: 'if-Regel: {P ∧ b} S₁ {Q} und {P ∧ ¬b} S₂ {Q}.', s: 'Folien EProg Kap. 6.5, Folien 44–47' },

  { id: 'ep6-w3', t: 'ep6', d: 3, k: 'w',
    q: 'Beweise mit einer Invariante:\n`{n ≥ 0} s = 0; k = 0; while (k != n) { k = k + 1; s = s + 2 * k - 1; } {s == n * n}`\nGib die Invariante an und zeige alle drei Teile.',
    hint: 'Nach k Durchläufen wurden die ersten k ungeraden Zahlen addiert.',
    sol: [
      'Invariante I: `s == k * k`.',
      'Etabliert: nach `s = 0; k = 0` gilt 0 == 0·0.',
      'Erhalten: rückwärts durch den Rumpf wird aus `s == k * k` die Aussage `s + 2(k + 1) − 1 == (k + 1)²`. Aus s == k² folgt s + 2k + 1 == k² + 2k + 1 == (k + 1)². Also `{I ∧ k ≠ n} Rumpf {I}`.',
      'Stark genug: I ∧ ¬(k ≠ n) heisst s == k² ∧ k == n, also s == n².'
    ],
    res: 'Invariante `s == k * k`',
    m: 'Erhaltung prüft man am einfachsten rückwärts durch den Rumpf.', s: 'Folien EProg Kap. 6.6, Folien 64–67' },

  { id: 'ep6-w4', t: 'ep6', d: 2, k: 'w',
    q: 'Entwickle mit der Strategie aus der Vorlesung eine Schleife, die für `n ≥ 0` die Potenz `r == b^n` berechnet (nur Multiplikation). Gib Invariante, Rumpf, Abbruchbedingung und Initialisierung an.',
    sol: [
      'Idee: n-mal mit b multiplizieren, i zählt die bisherigen Multiplikationen.',
      'Invariante: `r == b^i ∧ 0 ≤ i ≤ n`.',
      'Rumpf, der die Invariante erhält: `r = r * b; i = i + 1;`',
      'Abbruch so, dass I ∧ ¬b ⟹ Q: Schleife solange `i != n`. Am Ende i == n, also r == bⁿ.',
      'Initialisierung, die I etabliert: `r = 1; i = 0;` (b⁰ = 1).'
    ],
    res: '```\nr = 1; i = 0;\n// inv: r == b^i && 0 <= i <= n\nwhile (i != n) {\n    r = r * b;\n    i = i + 1;\n}\n```',
    m: 'Erst die Invariante, dann Rumpf, Abbruch und Initialisierung daraus ableiten.', s: 'Folien EProg Kap. 6.6, Folien 74–80' }
]);

<script>
// EProg Teil 3: Kapitel 7 (Klassen und Objekte), 8 (Stil, Refactoring), 9 (Verkettete Liste, Wrapper)
QUIZ.add('ep', [
  // ---------------- Kapitel 7: Klassen und Objekte ----------------
  { id: 'ep7-01', t: 'ep7', d: 1, k: 'sc',
    q: 'Was passiert bei der letzten Zeile?',
    code: 'class Point {\n    int x;\n    int y;\n    Point(int x, int y) {\n        this.x = x;\n        this.y = y;\n    }\n}\n\nPoint p = new Point();',
    out: '#compile-error',
    o: ['Compilerfehler: Konstruktor Point() existiert nicht', 'p ist der Punkt (0, 0)', 'p ist null', 'Laufzeitfehler'], a: 0,
    w: { 1: 'Das wäre richtig, wenn die Klasse gar keinen eigenen Konstruktor hätte.' },
    e: 'Java stellt den parameterlosen Standardkonstruktor nur bereit, solange man keinen eigenen Konstruktor schreibt. Hier gibt es nur `Point(int, int)`. Abhilfe: `Point() { this(0, 0); }` ergänzen.',
    m: 'Eigener Konstruktor → Standardkonstruktor verschwindet.', s: 'Folien EProg Kap. 7.5, Folien 78 und 84' },

  { id: 'ep7-02', t: 'ep7', d: 2, k: 'sc',
    q: 'In der Klasse `Point` steht `public void Point(int x, int y) { this.x = x; this.y = y; }`. Was ist das?',
    o: ['Eine gewöhnliche Methode, die zufällig wie die Klasse heisst', 'Ein Konstruktor', 'Ein Compilerfehler', 'Ein Konstruktor, der nichts zurückgibt'], a: 0,
    w: { 1: 'Konstruktoren haben gar keinen Rückgabetyp, auch nicht void.', 2: 'Das ist erlaubt, nur sehr verwirrend.' },
    e: 'Mit Rückgabetyp `void` ist es eine normale Objektmethode. `new Point(3, 4)` würde dann nicht kompilieren, und `new Point()` ruft den Standardkonstruktor auf, der x und y auf 0 lässt.',
    m: 'Konstruktor: Name wie die Klasse, kein Rückgabetyp.', s: 'Folien EProg Kap. 7.5, Folie 83' },

  { id: 'ep7-03', t: 'ep7', d: 2, k: 'sc', fix: true,
    q: 'Was gibt dieser Code aus?',
    code: 'class Counter {\n    int value;\n    void incrementBy(int value) {\n        value = value + value;\n    }\n}\n\nCounter c = new Counter();\nc.incrementBy(5);\nSystem.out.println(c.value);',
    out: '0',
    o: ['0', '5', '10', 'Compilerfehler'], a: 0,
    w: { 1: 'Das Attribut wird nie verändert.', 2: 'Verdoppelt wird nur der Parameter.' },
    e: 'Der Parameter `value` verdeckt das gleichnamige Attribut („shadowing“). Alle drei `value` in der Zeile meinen den Parameter. Richtig: `this.value = this.value + value;`.',
    m: 'Bei gleichen Namen gewinnt die lokale Variable. Attribut dann mit `this.` ansprechen.', s: 'Folien EProg Kap. 7.3, Folie 62' },

  { id: 'ep7-04', t: 'ep7', d: 2, k: 'sc',
    q: 'Was gibt dieser Code aus?',
    code: 'class Point {\n    int x;\n    int y;\n    Point(int initialX, int initialY) {\n        int x = initialX;\n        int y = initialY;\n    }\n}\n\nPoint p = new Point(3, 4);\nSystem.out.println(p.x + " " + p.y);',
    out: '0 0',
    o: ['0 0', '3 4', 'Compilerfehler: x doppelt deklariert', 'null null'], a: 0,
    w: { 1: 'Die Werte landen in lokalen Variablen, die nach dem Konstruktor verschwinden.', 2: 'Lokale Variablen dürfen wie Attribute heissen.' },
    e: '`int x = initialX;` deklariert eine neue lokale Variable, die das Attribut verdeckt. Die Attribute behalten ihre Standardwerte 0.',
    m: 'Im Konstruktor kein Typ vor das Attribut schreiben.', s: 'Folien EProg Kap. 7.5, Folie 82' },

  { id: 'ep7-05', t: 'ep7', d: 2, k: 'sc',
    q: 'Die Klasse Point definiert nur `public String toString(String sep) { return "(" + x + sep + y + ")"; }`. Was gibt `System.out.println(new Point())` aus?',
    o: ['Etwas wie `Point@3632be31`', '`(0, 0)`', '`(00)`', 'Compilerfehler: toString braucht ein Argument'], a: 0,
    w: { 1: 'Diese Methode gibt es gar nicht.', 2: 'println ruft `toString()` ohne Argument auf, nicht `toString(String)`.' },
    e: 'println ruft intern `toString()` ohne Parameter auf. Die Methode mit Parameter ist eine andere Methode (Überladung) und überschreibt nichts. Es bleibt die Standarddarstellung Klassenname@Adresse.',
    m: 'Überschreiben klappt nur mit genau `public String toString()`.', s: 'Folien EProg Kap. 7.4, Folien 70–71' },

  { id: 'ep7-06', t: 'ep7', d: 2, k: 'sc',
    q: 'Was gibt dieser Code aus?',
    code: 'class Point { int x; int y; }\n\nPoint p1 = new Point();\nPoint p2 = p1;\np1.x = 5;\np2.y = 7;\np1 = new Point();\np2.x = p1.x + p2.y;\np1.y = p2.x * 2;\nSystem.out.println(p1.x + "," + p1.y + "," + p2.x + "," + p2.y);',
    out: '0,14,7,7',
    o: ['0,14,7,7', '5,14,7,7', '0,14,12,7', '7,14,7,7'], a: 0,
    w: { 1: 'p1 zeigt nach `new Point()` auf ein frisches Objekt mit x = 0.', 2: 'p1.x ist im neuen Objekt 0, also 0 + 7.' },
    e: 'Zuerst zeigen p1 und p2 auf dasselbe Objekt A = (5, 7). Dann zeigt p1 auf ein neues Objekt B = (0, 0). `p2.x = 0 + 7` setzt A.x = 7. `p1.y = 7 * 2` setzt B.y = 14. Ausgabe: B.x, B.y, A.x, A.y.',
    m: 'Pfeile zeichnen: Welche Variable zeigt gerade auf welches Objekt?', s: 'Folien EProg Kap. 7.2, Folien 29–31' },

  { id: 'ep7-07', t: 'ep7', d: 3, k: 'sc',
    q: 'Was gibt dieser Code aus?',
    code: 'class Point { int x; int y; }\nstatic void copyAndInc(Point src, Point dst) {\n    dst.x = src.x + 1;\n    dst.y = src.y + 1;\n}\n\nPoint p1 = new Point();\nPoint p2 = p1;\np1.x = 10;\np1.y = 20;\ncopyAndInc(p1, p2);\nSystem.out.println(p1.x + "," + p1.y + "," + p2.x + "," + p2.y);',
    out: '11,21,11,21',
    o: ['11,21,11,21', '10,20,11,21', '11,21,10,20', '12,22,12,22'], a: 0,
    w: { 1: 'src und dst sind dasselbe Objekt.', 3: 'Jede Koordinate wird nur einmal erhöht.' },
    e: 'p1 und p2 zeigen auf dasselbe Objekt, also auch src und dst. `dst.x = src.x + 1` setzt x auf 11, `dst.y = src.y + 1` setzt y auf 21. Alle vier Ausgaben lesen dasselbe Objekt.',
    m: 'Aliasing in Parametern: zwei Namen, ein Objekt.', s: 'Folien EProg Kap. 7.2, Folien 32–33' },

  { id: 'ep7-08', t: 'ep7', d: 1, k: 'sc', fix: true,
    q: 'Welche id bekommt `p3`?',
    code: 'class Person {\n    private static int counter = 0;\n    private int id;\n    Person() {\n        id = counter;\n        counter += 1;\n    }\n}\n\nPerson p1 = new Person();\nPerson p2 = new Person();\nPerson p3 = new Person();',
    o: ['2', '3', '0', '1'], a: 0,
    w: { 1: 'counter wird erst nach der Zuweisung erhöht, und er startet bei 0.', 2: 'counter ist statisch und wird von allen Objekten geteilt.' },
    e: 'Das statische Attribut counter existiert genau einmal für die ganze Klasse. Die Objekte bekommen nacheinander 0, 1, 2.',
    m: 'static = einmal pro Klasse, nicht pro Objekt.', s: 'Folien EProg Kap. 7.7, Folie 118' },

  { id: 'ep7-09', t: 'ep7', d: 2, k: 'sc',
    q: 'Warum kompiliert das nicht?', code: 'class Villekulla {\n    int x;\n    static void print() {\n        System.out.println(this.x);\n    }\n}',
    o: ['In einer statischen Methode gibt es kein `this`', 'x ist nicht initialisiert', 'println kann keine int ausgeben', 'Statische Methoden dürfen nichts ausgeben'], a: 0,
    w: { 1: 'Attribute werden automatisch mit 0 initialisiert.' },
    e: 'Statische Methoden laufen ohne Objektbezug, es gibt kein Aufruferobjekt. Deshalb ist `this` dort verboten, und auch ein blosses `x` (Objektattribut) geht nicht.',
    m: 'static → kein this, kein Zugriff auf Objektattribute ohne Objekt.', s: 'Folien EProg Kap. 7.7, Folie 112' },

  { id: 'ep7-10', t: 'ep7', d: 2, k: 'sc',
    q: 'In `class Rational { private int nom; private int den; … }` steht der Konstruktor `Rational(Rational other) { nom = other.nom; den = other.den; }`. Was stimmt?',
    o: ['Kompiliert: private Attribute sind für alle Objekte derselben Klasse sichtbar', 'Compilerfehler: other.nom ist privat', 'Kompiliert nur mit Gettern', 'Kompiliert, aber nom und den bleiben 0'], a: 0,
    w: { 1: 'private schränkt nach Klasse ein, nicht nach Objekt.' },
    e: '`private` heisst: nur Code innerhalb der Klasse Rational darf zugreifen. Dieser Code darf auch die privaten Attribute anderer Rational-Objekte lesen und schreiben.',
    m: 'Sichtbarkeit gilt pro Klasse, nicht pro Objekt.', s: 'Folien EProg Kap. 7.6, Folie 95' },

  { id: 'ep7-11', t: 'ep7', d: 2, k: 'sc',
    q: 'Was passiert?',
    code: 'class Cat { int age; String name; }\n\nCat[] cats = new Cat[3];\ncats[1] = new Cat();\ncats[1].age = 2;\nSystem.out.println(cats[1].age);\nSystem.out.println(cats[1].name);\nSystem.out.println(cats[1].name.length());',
    out: '2\nnull\n#exception:NullPointerException',
    o: ['Ausgabe 2 und null, dann NullPointerException', 'Ausgabe 2, dann NullPointerException', 'Ausgabe 2, null und 0', 'NullPointerException schon bei `cats[1].age = 2`'], a: 0,
    w: { 1: 'Einen null-String auszugeben ist erlaubt, es erscheint „null“.', 2: 'Auf null kann man keine Methode aufrufen.', 3: 'cats[1] zeigt auf ein echtes Cat-Objekt.' },
    e: 'cats[1] ist ein Objekt, dessen Attribut name mit null vorbelegt ist. `println(null)` gibt „null“ aus. Erst `name.length()` dereferenziert null und wirft die Exception.',
    m: 'null ausgeben geht, null dereferenzieren nicht.', s: 'Folien EProg Kap. 7.2, Folien 34–39' },

  { id: 'ep7-12', t: 'ep7', d: 1, k: 'sc',
    q: 'In `MyMathLib` steht `public static final double PI = 3.1415;`. Was passiert bei `MyMathLib.PI = 0;` in einem Klienten?',
    o: ['Compilerfehler, final kann man nicht neu zuweisen', 'PI ist danach 0 für alle', 'PI ist nur für diesen Klienten 0', 'Laufzeitfehler'], a: 0,
    e: '`final` heisst: nach der Initialisierung nicht mehr veränderbar. Deshalb sind `public static final`-Attribute als globale Konstanten in Ordnung.',
    m: 'Faustregel: public static nur zusammen mit final.', s: 'Folien EProg Kap. 7.7, Folie 116' },

  { id: 'ep7-13', t: 'ep7', d: 1, k: 'sc',
    q: 'Was gibt dieser Code aus?', code: 'enum Status { SUBMITTED, SHIPPED, PAID }\n\nSystem.out.println(Status.PAID.ordinal() + " " + Status.valueOf("SHIPPED").name());', out: '2 SHIPPED',
    o: ['2 SHIPPED', '3 SHIPPED', '2 shipped', '3 1'], a: 0,
    w: { 1: 'ordinal zählt ab 0.', 2: '`name()` liefert den Namen genau wie deklariert.' },
    e: '`ordinal()` ist die Position ab 0: SUBMITTED = 0, SHIPPED = 1, PAID = 2. `valueOf("SHIPPED")` liefert die Konstante, `name()` wieder den String.',
    m: 'Enum: `==` zum Vergleichen, `ordinal()` ab 0, `name()`/`valueOf()` zum Umwandeln.', s: 'Folien EProg Kap. 7.8, Folien 124–125' },

  { id: 'ep7-14', t: 'ep7', d: 2, k: 'sc',
    q: 'Welcher Konstruktor für `User(String name, int age, Point location)` kompiliert?',
    o: [
      '`User(String name) { this(name, -1, null); }`',
      '`User(String name) { this.name = name; this(name, -1, null); }`',
      '`User(String name) { User(name, -1, null); }`',
      '`User(String name) { return new User(name, -1, null); }`'
    ], a: 0,
    w: { 1: '`this(…)` muss die erste Anweisung im Konstruktor sein.', 2: 'Ein Konstruktor wird nicht wie eine Methode mit seinem Namen aufgerufen.', 3: 'Konstruktoren geben nichts zurück.' },
    e: 'Ein Konstruktor kann einen anderen mit `this(…)` aufrufen, um Redundanz zu vermeiden. Das muss dann die erste Anweisung im Rumpf sein.',
    m: 'Delegieren mit `this(…)` als erste Zeile.', s: 'Folien EProg Kap. 7.5, Folien 80–81' },

  { id: 'ep7-15', t: 'ep7', d: 3, k: 'sc',
    q: 'Was gibt dieser Code aus?',
    code: 'class C {\n    static int s = 0;\n    int i = 0;\n    C() {\n        s++;\n        i++;\n    }\n}\n\nC a = new C();\nC b = new C();\nC c = new C();\nSystem.out.println(a.s + " " + a.i + " " + c.s + " " + c.i);',
    out: '3 1 3 1',
    o: ['3 1 3 1', '1 1 3 1', '3 3 3 3', '1 1 1 1'], a: 0,
    w: { 1: '`a.s` liest das eine statische Attribut, nicht einen Wert „von a“.', 2: 'i ist pro Objekt und wird pro Objekt genau einmal erhöht.' },
    e: '`s` gibt es einmal für die Klasse und wurde dreimal erhöht. `i` gibt es pro Objekt, jedes Objekt hat i = 1. `a.s` ist erlaubt, liest aber das Klassenattribut. Besser schreibt man `C.s`.',
    m: 'Statische Attribute über den Klassennamen ansprechen, das vermeidet Verwirrung.', s: 'Folien EProg Kap. 7.7, Folien 114–118' },

  { id: 'ep7-16', t: 'ep7', d: 3, k: 'sc',
    q: 'Was gibt dieser Code aus?',
    code: 'class Point {\n    int x;\n    int y;\n    public String toString() {\n        return "(" + x + ", " + y + ")";\n    }\n}\nclass Line {\n    Point from;\n    Point to;\n    public String toString() {\n        return from + " -> " + to;\n    }\n}\n\nLine line = new Line();\nline.to = new Point();\nline.to.x = 4;\nSystem.out.println("L: " + line);',
    out: 'L: null -> (4, 0)',
    o: ['`L: null -> (4, 0)`', 'NullPointerException', '`L: (0, 0) -> (4, 0)`', '`L: Line@1b6d3586`'], a: 0,
    w: { 1: 'Bei der String-Verkettung wird null zu „null“, ohne Exception.', 2: 'from wurde nie gesetzt, es bleibt null.', 3: 'Line überschreibt toString() korrekt.' },
    e: '`"L: " + line` ruft `line.toString()` auf. Dort ist from noch null. Verkettung mit null liefert den Text „null“, es wird nichts dereferenziert. Erst `from.toString()` würde eine Exception werfen.',
    m: '`"…" + ref` ist auch für ref == null sicher, `ref.methode()` nicht.', s: 'Folien EProg Kap. 7.4, Folien 69–73' },

  { id: 'ep7-17', t: 'ep7', d: 2, k: 'mc',
    q: 'Welche Aussagen stimmen? Wähle alle.',
    o: ['Ein int-Attribut ohne Initialisierung hat den Wert 0.', 'Ein String-Attribut ohne Initialisierung ist null.', 'Eine lokale int-Variable ohne Zuweisung hat den Wert 0.', 'Elemente von `new boolean[3]` sind false.', 'Eine lokale String-Variable ohne Zuweisung wird als „null“ ausgegeben.'], a: [0, 1, 3],
    w: { 2: 'Lesen ergibt einen Compilerfehler.', 4: 'Auch das ist ein Compilerfehler, kein „null“.' },
    e: 'Attribute und Array-Elemente werden automatisch vorbelegt (0, 0.0, false, null). Lokale Variablen dagegen müssen vor dem ersten Lesen zugewiesen werden.',
    m: 'Vorbelegt: Attribute und Array-Elemente. Nicht vorbelegt: lokale Variablen.', s: 'Folien EProg Kap. 7.2, Folie 22, und Kap. 2.3, Folie 77' },

  { id: 'ep7-18', t: 'ep7', d: 2, k: 'sc',
    q: '`Rational` speichert nom und den und vergleicht mit `isEqualTo(other)`: `nom == other.nom && den == other.den`. Was liefert `new Rational(1, 3).isEqualTo(new Rational(2, 6))`, wenn der Konstruktor nicht kürzt?',
    o: ['false', 'true', 'Compilerfehler', 'NullPointerException'], a: 0,
    e: '1/3 und 2/6 sind dieselbe Zahl, aber die gespeicherten Attribute sind verschieden. Abhilfe: im Konstruktor (und nach jeder Änderung) mit dem ggT kürzen, als private Hilfsmethode.',
    m: 'Eine Objektinvariante wie „immer gekürzt“ vereinfacht den Vergleich.', s: 'Folien EProg Kap. 7.6, Folien 104–105' },

  { id: 'ep7-19', t: 'ep7', d: 1, k: 'sc',
    q: 'Warum macht man das Attribut `den` (Nenner) einer Klasse Rational `private` und bietet einen Setter an?',
    o: ['Damit der Setter die Objektinvariante den ≠ 0 durchsetzen kann', 'Weil private Attribute schneller sind', 'Weil Attribute sonst nicht initialisiert werden', 'Damit andere Rational-Objekte nicht darauf zugreifen können'], a: 0,
    w: { 3: 'Andere Rational-Objekte dürfen auch auf private Attribute zugreifen.' },
    e: 'Datenkapselung: Klienten können den Zustand nur über Methoden ändern. Diese Methoden prüfen die Konsistenzbedingung. Ausserdem kann man die interne Darstellung später ändern, ohne Klienten anzupassen.',
    m: 'Encapsulation: Invarianten schützen, interne Darstellung austauschbar halten.', s: 'Folien EProg Kap. 7.6, Folien 87–102' },

  { id: 'ep7-w1', t: 'ep7', d: 1, k: 'w',
    q: 'Schreibe eine Klasse `Point` mit privaten int-Attributen x und y, einem Konstruktor `Point(int x, int y)`, einem parameterlosen Konstruktor für (0, 0) **ohne doppelten Code**, Gettern und einer `toString`-Methode, die z. B. „(2, -1)“ liefert.',
    sol: [
      'Attribute privat, Konstruktor mit `this.x = x` gegen das Shadowing.',
      'Parameterloser Konstruktor delegiert mit `this(0, 0)`.',
      '```\npublic class Point {\n    private int x;\n    private int y;\n\n    public Point(int x, int y) {\n        this.x = x;\n        this.y = y;\n    }\n\n    public Point() {\n        this(0, 0);\n    }\n\n    public int getX() { return x; }\n    public int getY() { return y; }\n\n    public String toString() {\n        return "(" + x + ", " + y + ")";\n    }\n}\n```'
    ],
    res: 'Delegation mit `this(0, 0)`, toString mit genau der Signatur `public String toString()`.',
    m: 'Kein Rückgabetyp beim Konstruktor, `this.` bei gleichen Namen.', s: 'Folien EProg Kap. 7.4–7.6' },

  { id: 'ep7-w2', t: 'ep7', d: 3, k: 'w',
    q: 'Was gibt das Programm aus? Zeichne die Objekte und Referenzen.',
    code: 'class Box {\n    int v;\n    Box(int v) { this.v = v; }\n}\nstatic Box f(Box a, Box b) {\n    a.v = a.v + b.v;\n    b = new Box(100);\n    b.v++;\n    return a;\n}\n\nBox x = new Box(1);\nBox y = new Box(2);\nBox z = f(x, y);\nz.v = z.v * 10;\nSystem.out.println(x.v + " " + y.v + " " + z.v);',
    out: '30 2 30', ans: { k: 'str', v: ['30 2 30'], ph: 'Ausgabe' },
    sol: [
      'Im Aufruf zeigt a auf das Objekt von x, b auf das Objekt von y.',
      '`a.v = 1 + 2 = 3` ändert das Objekt von x.',
      '`b = new Box(100)` hängt nur den Parameter um, `b.v++` ändert das neue Objekt (101). Das Objekt von y bleibt bei 2.',
      'Rückgabe a: z zeigt auf dasselbe Objekt wie x. `z.v = 30` ändert also auch x.v.'
    ],
    res: 'Ausgabe: `30 2 30`',
    m: 'Eine zurückgegebene Referenz ist ein weiterer Alias.', s: 'Folien EProg Kap. 7.2' },

  { id: 'ep7-w3', t: 'ep7', d: 2, k: 'w',
    q: 'Implementiere eine Klasse `Zeitspanne` mit der Objektinvariante **0 ≤ minuten < 60** und stunden ≥ 0. Gewünscht: Konstruktor `Zeitspanne(int stunden, int minuten)`, der zu viele Minuten umrechnet (z. B. (0, 90) → 1:30), eine Methode `add(Zeitspanne t)` und `toString()` im Format „4:05“.',
    hint: 'Für zweistellige Minuten: wenn minuten < 10, eine 0 voranstellen.',
    sol: [
      'Attribute privat halten, damit die Invariante nur in der Klasse gesetzt wird.',
      'Eine private Hilfsmethode `normalize()` stellt die Invariante nach jeder Änderung her.',
      '```\npublic class Zeitspanne {\n    private int stunden;\n    private int minuten; // INV: 0 <= minuten < 60\n\n    public Zeitspanne(int stunden, int minuten) {\n        this.stunden = stunden;\n        this.minuten = minuten;\n        normalize();\n    }\n\n    public void add(Zeitspanne t) {\n        stunden += t.stunden;\n        minuten += t.minuten;\n        normalize();\n    }\n\n    private void normalize() {\n        stunden += minuten / 60;\n        minuten = minuten % 60;\n    }\n\n    public String toString() {\n        return stunden + ":" + (minuten < 10 ? "0" : "") + minuten;\n    }\n}\n```',
      'Kontrolle: 3:45 plus 0:20 ergibt 3 Stunden, 65 Minuten, normalisiert 4:05. Negative Werte müsste man zusätzlich abfangen.'
    ],
    res: 'Invariante in jedem Konstruktor und jedem Mutator wiederherstellen.',
    m: 'Konstruktoren etablieren die Invariante, Methoden erhalten sie.', s: 'Folien EProg Kap. 7.6, Folien 95 und 107' },

  // ---------------- Kapitel 8: Stil und Refactoring ----------------
  { id: 'ep8-01', t: 'ep8', d: 1, k: 'mc',
    q: 'Welche Namen folgen den Java-Konventionen? Wähle alle.',
    o: ['Klasse `StudentRecord`', 'Methode `computeTotal`', 'Konstante `MAX_SIZE`', 'Variable `NamesArray`', 'Methode `Berechne`'], a: [0, 1, 2],
    w: { 3: 'Variablen beginnen klein, und Typinformation im Namen ist meist unnötig.', 4: 'Methoden beginnen mit einem Kleinbuchstaben.' },
    e: 'Klassen: UpperCamelCase, meist ein Nomen. Methoden: lowerCamelCase, meist mit Verb. Variablen: lowerCamelCase. Konstanten: GROSS_MIT_UNTERSTRICH.',
    m: 'Camel-Case überall, ausser bei Konstanten.', s: 'Folien EProg Kap. 8.1, Folie 6' },

  { id: 'ep8-02', t: 'ep8', d: 2, k: 'sc',
    q: 'Welche Änderung ist **kein** Refactoring?',
    o: ['Einen fest eingebauten Ersatzwert neu als Parameter übergeben, mit dem der Aufrufer andere Ergebnisse erhalten kann', 'Doppelten Code in eine Hilfsmethode auslagern', 'Eine Variable umbenennen, damit ihr Zweck klar wird', 'Eine verschachtelte if-Kaskade durch einen gleichwertigen booleschen Ausdruck ersetzen'], a: 0,
    e: 'Refactoring ändert die interne Struktur, aber nicht das von aussen beobachtbare Verhalten. Ein neuer Parameter, der andere Ergebnisse erlaubt, ändert die Schnittstelle und das Verhalten. Das ist eine Generalisierung, kein Refactoring.',
    m: 'Refactoring = Verhalten bleibt gleich.', s: 'Folien EProg Kap. 8.2, Folien 18 und 25' },

  { id: 'ep8-03', t: 'ep8', d: 2, k: 'sc',
    q: 'Es gilt a ∈ {1, 2, 3}. Welcher Code verhält sich **genau gleich** wie dieser?',
    code: 'if (a == 1) {\n    System.out.println(a); x = 2; s = s + x;\n} else if (a == 2) {\n    System.out.println(a); t = t * 2; x = 4; s = s + 4;\n} else {\n    System.out.println(a); x = 6; s += x;\n}',
    o: [
      '`System.out.println(a); x = 2 * a; if (a == 2) { t = t * 2; } s = s + x;`',
      '`System.out.println(a); x = 2 * a; t = t * 2; s = s + x;`',
      '`x = 2 * a; s = s + x; if (a == 2) { System.out.println(a); t = t * 2; }`',
      '`System.out.println(a); x = a + 1; if (a == 2) { t = t * 2; } s = s + x;`'
    ], a: 0,
    w: { 1: 't würde in allen Fällen verdoppelt.', 2: 'Die Ausgabe gibt es in allen drei Fällen.', 3: 'Für a = 1 wäre x = 2, für a = 3 aber 4 statt 6.' },
    e: 'Gemeinsam ist allen Fällen: Ausgabe von a, x = 2a (2, 4, 6) und s um x erhöhen. Nur bei a == 2 kommt `t = t * 2` dazu. Die Reihenfolge von `t = t * 2` und den anderen Zuweisungen spielt keine Rolle, weil sie unabhängig sind.',
    m: 'Gemeinsamkeiten herausziehen, nur echte Unterschiede im if behalten.', s: 'Folien EProg Kap. 8.2, Folien 21–22' },

  { id: 'ep8-04', t: 'ep8', d: 3, k: 'sc',
    q: 'Welche Zuweisung ist äquivalent zu dieser Kaskade (n ist ein int)?',
    code: 'if (n < 0) {\n    ok = false;\n} else if (n > 100) {\n    ok = false;\n} else if (n % 2 == 1) {\n    ok = false;\n} else {\n    ok = true;\n}',
    o: ['`ok = 0 <= n && n <= 100 && n % 2 == 0;`', '`ok = !(n < 0 && n > 100) && n % 2 == 0;`', '`ok = 0 < n && n < 100 && n % 2 == 0;`', '`ok = n >= 0 || n <= 100 && n % 2 == 0;`'], a: 0,
    w: { 1: '`n < 0 && n > 100` ist nie wahr, also wären negative gerade Zahlen ok.', 2: '0 und 100 wären fälschlich ausgeschlossen.', 3: 'Wegen `||` wäre z. B. 7 ok.' },
    e: 'ok ist genau dann true, wenn keine der drei Bedingungen zutrifft: n ≥ 0, n ≤ 100 und n gerade. Nach De Morgan wird aus der Negation einer Disjunktion eine Konjunktion.',
    m: 'if-Kaskade, die nur boolean setzt → direkt den booleschen Ausdruck zuweisen.', s: 'Folien EProg Kap. 8.2, Folie 20' },

  { id: 'ep8-05', t: 'ep8', d: 1, k: 'mc',
    q: 'Welche Empfehlungen stammen aus der Vorlesung? Wähle alle.',
    o: ['Parameter nicht neu zuweisen', 'Eine Anweisung pro Zeile', 'Geschweifte Klammern auch bei einzeiligen Blöcken', 'Werte zwischen Methoden über public static Attribute austauschen', 'Typinformation in Variablennamen wie `namesArray`'], a: [0, 1, 2],
    w: { 3: 'Ein „Recipe for disaster“. Besser über Parameter, Rückgabewerte oder Objektattribute.', 4: 'Meistens unnötig.' },
    e: 'Lesbarer Code folgt Konventionen und klaren Strukturen. Gemeinsam veränderbarer globaler Zustand über public static Attribute macht Programme schwer nachvollziehbar.',
    m: 'Stil ist für Menschen, dem Compiler ist er egal.', s: 'Folien EProg Kap. 8.1, Folien 7–13, und Kap. 7.7, Folie 119' },

  { id: 'ep8-w1', t: 'ep8', d: 1, k: 'w',
    q: 'Refaktoriere diese Methode so, dass kein Code doppelt vorkommt. Das Verhalten darf sich nicht ändern.',
    code: 'public double getSalary() {\n    double sumStd = 0;\n    for (int j = 0; j < hours.length; j++) {\n        sumStd += hours[j];\n    }\n    double sumOvt = 0;\n    for (int j = 0; j < overtime.length; j++) {\n        sumOvt += overtime[j];\n    }\n    return sumStd * 30.70 + sumOvt * 38.40;\n}',
    sol: [
      'Die beiden Schleifen machen dasselbe mit verschiedenen Arrays → Hilfsmethode mit Array-Parameter.',
      '```\nprivate static double sum(double[] values) {\n    double s = 0;\n    for (int j = 0; j < values.length; j++) {\n        s += values[j];\n    }\n    return s;\n}\n\npublic double getSalary() {\n    return sum(hours) * 30.70 + sum(overtime) * 38.40;\n}\n```',
      'Optional weiter zerlegen in `getStandardSalary()` und `getOvertimeSalary()`.'
    ],
    res: 'Hilfsmethode `sum(double[])`, getSalary nur noch eine Zeile.',
    m: 'Gleicher Code mit anderen Daten → Methode mit Parameter.', s: 'Folien EProg Kap. 8.2, Folie 19' },

  // ---------------- Kapitel 9: Verkettete Liste, Wrapper ----------------
  { id: 'ep9-01', t: 'ep9', d: 2, k: 'sc',
    q: 'Was gibt dieser Code aus?',
    code: 'class ListNode {\n    int value;\n    ListNode next;\n    ListNode(int value) { this.value = value; }\n    ListNode(int value, ListNode next) { this(value); this.next = next; }\n}\n\nListNode list = new ListNode(1, new ListNode(2, new ListNode(3)));\nlist = new ListNode(0, list);\nlist.next.next = list.next.next.next;\nListNode cur = list;\nwhile (cur != null) {\n    System.out.print(cur.value + " ");\n    cur = cur.next;\n}',
    out: '0 1 3',
    o: ['0 1 3', '0 2 3', '1 2 3', '0 1 2 3'], a: 0,
    w: { 1: '`list.next` ist der Knoten 1, an ihm wird umgehängt.', 3: 'Der Knoten 2 wird übersprungen.' },
    e: 'Nach dem Einfügen vorne: 0 → 1 → 2 → 3. `list.next.next` ist der next-Verweis von Knoten 1. Er zeigt danach auf `list.next.next.next`, also Knoten 3. Knoten 2 ist nicht mehr erreichbar.',
    m: 'Links der Zuweisung wird ein Zeiger umgehängt, rechts wird ein Ziel gelesen.', s: 'Folien EProg Kap. 9.1, Folien 7–12' },

  { id: 'ep9-02', t: 'ep9', d: 1, k: 'sc',
    q: 'Nach `while (list != null) { System.out.print(list.value + " "); list = list.next; }` sind alle Werte ausgegeben. Was ist das Problem?',
    o: ['list ist danach null, der Zugang zur Liste ist verloren', 'Der letzte Wert wird nicht ausgegeben', 'Die Schleife terminiert nicht', 'Es gibt eine NullPointerException beim letzten Knoten'], a: 0,
    w: { 1: 'Auch der letzte Knoten wird ausgegeben, erst danach wird list null.', 3: 'Die Bedingung prüft vor jedem Zugriff auf null.' },
    e: 'Die Variable list wird zum Durchlaufen verwendet und zeigt am Ende auf null. Wenn sie die einzige Referenz auf den ersten Knoten war, ist die Liste weg. Lösung: separate Laufvariable `ListNode current = list;`.',
    m: 'Zum Durchlaufen immer eine eigene Laufvariable nehmen.', s: 'Folien EProg Kap. 9.1, Folien 13–15' },

  { id: 'ep9-03', t: 'ep9', d: 2, k: 'sc',
    q: 'Was passiert bei dieser Version von `back()`, wenn die Liste **leer** ist (front == null)?',
    code: 'private ListNode back() {\n    ListNode current = front;\n    while (current.next != null) {\n        current = current.next;\n    }\n    return current;\n}',
    o: ['NullPointerException', 'Rückgabe null', 'Endlosschleife', 'Compilerfehler'], a: 0,
    w: { 1: 'Das macht die korrigierte Version mit `current != null && current.next != null`.' },
    e: 'current ist null, und schon die erste Prüfung `current.next` dereferenziert null. Die Korrektur nutzt die Kurzschlussauswertung: `while (current != null && current.next != null)`.',
    m: 'Edge Case leere Liste immer prüfen.', s: 'Folien EProg Kap. 9.3, Folien 27–28' },

  { id: 'ep9-04', t: 'ep9', d: 3, k: 'sc',
    q: '`merge(other)` hängt other an: falls front == null, `front = other.front`, sonst `back().next = other.front`; danach `other.front = null`. Was passiert bei `list.merge(list)` für eine **nicht leere** Liste?',
    o: ['Die Liste ist danach leer, und die alten Knoten bilden einen Zyklus', 'Die Liste ist danach doppelt so lang', 'Nichts ändert sich', 'NullPointerException'], a: 0,
    w: { 1: 'Es wird kein Knoten kopiert.', 3: 'Alle Dereferenzierungen passieren auf echten Knoten.' },
    e: 'this und other sind dasselbe Objekt. `back().next = front` macht aus dem letzten Knoten einen Verweis auf den ersten: ein Zyklus. Dann setzt `other.front = null` auch `this.front` auf null. Die Liste ist leer, die Knoten unerreichbar.',
    m: 'Bei Methoden mit einem Parameter vom eigenen Typ an `this == other` denken.', s: 'Folien EProg Kap. 9.3, Folie 33' },

  { id: 'ep9-05', t: 'ep9', d: 2, k: 'sc',
    q: 'Was passiert?', code: 'public class OuterClass {\n    public static void main(String[] args) {\n        InnerClass inner = new InnerClass(9);\n    }\n    private class InnerClass {\n        private int x;\n        private InnerClass(int a) { x = a; }\n    }\n}',
    o: ['Compilerfehler: kein umgebendes OuterClass-Objekt', 'Es wird ein InnerClass-Objekt mit x = 9 erzeugt', 'Compilerfehler: InnerClass ist privat', 'Laufzeitfehler'], a: 0,
    w: { 2: 'Innerhalb von OuterClass ist die private innere Klasse sichtbar.' },
    e: 'Objekte einer (nicht statischen) inneren Klasse existieren nur innerhalb eines Objekts der äusseren Klasse. In der statischen main-Methode gibt es kein solches Objekt. javac meldet „non-static variable this cannot be referenced from a static context“, in den Folien steht die Variante „No enclosing instance of type OuterClass“.',
    m: 'Innere Klassen nur aus Objektmethoden der äusseren Klasse instanziieren.', s: 'Folien EProg Kap. 9.2, Folie 21' },

  { id: 'ep9-06', t: 'ep9', d: 3, k: 'sc',
    q: 'Was gibt dieser Code aus?',
    code: 'class Outer {\n    private int x = 7;\n    String foo() {\n        Inner in = new Inner(4);\n        return in.bar();\n    }\n    private class Inner {\n        private int x;\n        private Inner(int a) { x = a; }\n        private String bar() {\n            return x + Outer.this.x + "!";\n        }\n    }\n}\n\nSystem.out.println(new Outer().foo());',
    out: '11!',
    o: ['11!', '47!', '4 7!', '14!'], a: 0,
    w: { 1: 'Die Verkettung beginnt erst mit dem String "!", vorher wird addiert.', 3: 'x in Inner verdeckt das äussere x, aber `Outer.this.x` greift gezielt auf das äussere zu.' },
    e: 'In bar meint `x` das Attribut der inneren Klasse (4), `Outer.this.x` das der äusseren (7). Links wird zuerst addiert: 4 + 7 = 11, dann `+ "!"`.',
    m: '`Outer.this.name` greift aus der inneren Klasse auf die äussere zu.', s: 'Folien EProg Kap. 9.2, Folien 19–20' },

  { id: 'ep9-07', t: 'ep9', d: 1, k: 'sc',
    q: 'Was passiert bei `LinkedList<int> heights = new LinkedList<int>();`?',
    o: ['Compilerfehler: Collections brauchen einen Referenztyp, also Integer', 'Es funktioniert wie mit Integer', 'Laufzeitfehler beim ersten add', 'Die Liste kann nur 0 speichern'], a: 0,
    e: 'Java-Collections funktionieren nur mit Referenztypen. Für int nimmt man die Wrapper-Klasse Integer: `LinkedList<Integer>`. Werte werden dann automatisch ein- und ausgepackt.',
    m: 'Wrapper: int ↔ Integer, double ↔ Double, boolean ↔ Boolean.', s: 'Folien EProg Kap. 9.5, Folie 50' },

  { id: 'ep9-08', t: 'ep9', d: 3, k: 'mc',
    q: 'Gegeben `Integer i = 1;`. Welche Zeilen kompilieren? Wähle alle.',
    o: ['`int y = i + 1;`', '`Double d = 3;`', '`double e = i;`', '`Double f = i;`', '`Integer g = Integer.valueOf(5);`'], a: [0, 2, 4],
    w: { 0: 'Unboxing für die Addition.', 1: '3 ist ein int, ein Integer passt nicht in eine Double-Variable.', 2: 'Erst Unboxing zu int, dann die erlaubte Umwandlung int → double.', 3: 'Zwischen Wrappern gibt es keine Umwandlung.', 4: 'Explizites Boxing.' },
    e: 'Autoboxing passt nur zum eigenen Wrapper-Typ: int ↔ Integer. Ein int-Literal wird nicht zu Double. Wird aber ausgepackt, darf danach die normale primitive Umwandlung int → double folgen.',
    m: 'Keine Typumwandlung zwischen Wrapper-Klassen.', s: 'Folien EProg Kap. 9.5, Folien 51–53' },

  { id: 'ep9-09', t: 'ep9', d: 3, k: 'sc',
    q: 'Was gibt dieser Code aus?', code: 'Integer a = 1000;\nInteger b = 1000;\nSystem.out.println((a == b) + " " + a.equals(b));', out: 'false true',

    w: { 1: '`==` vergleicht bei Objekten die Referenzen, und hier sind es zwei Objekte.' },
    e: 'a und b sind Wrapper-Objekte. `==` prüft, ob es dasselbe Objekt ist. Für 1000 erzeugt das Autoboxing zwei verschiedene Objekte. (Für kleine Werte bis 127 verwendet Java dieselben Objekte wieder, darum täuscht ein Test mit kleinen Zahlen.) `equals` vergleicht den Inhalt.',
    m: 'Wrapper-Objekte immer mit `equals` vergleichen.', s: 'Folien EProg Kap. 9.5, Folie 54' },

  { id: 'ep9-10', t: 'ep9', d: 2, k: 'sc',
    q: 'Was gibt dieser Code aus?', code: 'ArrayList<String> names = new ArrayList<String>();\nnames.add("Ann");\nnames.add("Ben");\nnames.add("Clara");\nnames.remove(0);\nSystem.out.println(names.get(1) + " " + names.indexOf("Ann") + " " + names.size());', out: 'Clara -1 2',

  { id: 'ep9-11', t: 'ep9', d: 2, k: 'sc',
    q: 'Ein Binärbaum hat die Wurzel 5, links den Knoten 3 (mit Kindern 1 links und 4 rechts), rechts den Knoten 8 (nur mit rechtem Kind 9). Was gibt `visit()` aus, wenn zuerst der eigene Wert, dann links, dann rechts besucht wird?',

  { id: 'ep9-12', t: 'ep9', d: 2, k: 'sc',
    q: 'In `SortedLinkedList.add` steht `while (current.next != null && current.next.value < value)`. Was passiert, wenn man die beiden Bedingungen vertauscht?',

    e: 'Mit `current.next.value < value && current.next != null` wird zuerst `current.next.value` gelesen. Ist current.next null (beim Einfügen ganz hinten), wird null dereferenziert.',

  { id: 'ep9-13', t: 'ep9', d: 1, k: 'sc',
    q: 'Wie viele Schritte braucht `get(index)` in einer selbst geschriebenen einfach verketteten Liste ungefähr?',
    o: ['Proportional zu index, man muss vom Anfang aus laufen', 'Immer einen Schritt, wie bei einem Array', 'Proportional zur Länge der Liste, egal welcher index', 'Proportional zu log(index)'], a: 0,
    e: 'Die Liste kennt nur front. Um zum Knoten mit Index i zu kommen, folgt man i-mal dem next-Verweis. Arrays und ArrayList können dagegen direkt per Index zugreifen.',
    m: 'Verkettete Liste: schnell vorne einfügen, langsam per Index zugreifen.', s: 'Folien EProg Kap. 9.3, Folie 26, und Kap. 9.5, Folie 47' },

  { id: 'ep9-w1', t: 'ep9', d: 1, k: 'w',
    q: 'Schreibe für `class ListNode { int value; ListNode next; }` eine **rekursive** Methode `int sum()` in ListNode, die die Summe ab diesem Knoten liefert, und eine Methode `int sum()` in LinkedList (Attribut `front`), die auch für die leere Liste funktioniert.',
    sol: [
      'In ListNode: eigener Wert plus Summe des Rests, falls es einen Rest gibt.',
      '```\n// in ListNode\nint sum() {\n    if (next == null) {\n        return value;\n    }\n    return value + next.sum();\n}\n\n// in LinkedList\nint sum() {\n    if (front == null) {\n        return 0;\n    }\n    return front.sum();\n}\n```',
      'Die Prüfung auf null passiert vor dem Aufruf, weil man auf null keine Methode aufrufen kann.'

    res: 'Rekursion in ListNode, Sonderfall leere Liste in LinkedList.',
    m: 'Gleiches Muster wie `size()` aus der Vorlesung.', s: 'Folien EProg Kap. 9.4, Folie 42' },

  { id: 'ep9-w2', t: 'ep9', d: 3, k: 'w',
    q: 'Schreibe `void removeAll(int value)` für LinkedList (Attribut `front`), das **alle** Knoten mit diesem Wert entfernt. Denk an: leere Liste, mehrere Treffer am Anfang, Treffer direkt hintereinander, Treffer am Ende.',
    hint: 'Behandle zuerst alle Treffer am Anfang mit einer eigenen Schleife. Danach schaust du immer auf `current.next`.',
    sol: [
      'Vorne entfernen, solange der erste Knoten den Wert hat: `while (front != null && front.value == value) front = front.next;`',
      'Danach mit current von vorne laufen und jeweils den Nachfolger prüfen.',
      '```\nvoid removeAll(int value) {\n    while (front != null && front.value == value) {\n        front = front.next;\n    }\n    ListNode current = front;\n    while (current != null && current.next != null) {\n        if (current.next.value == value) {\n            current.next = current.next.next;   // nicht weiterlaufen!\n        } else {\n            current = current.next;\n        }\n    }\n}\n```',
      'Wichtig: nach dem Entfernen nicht weiterlaufen, sonst wird ein direkt folgender Treffer übersprungen.'
    ],
    res: 'Sonderfall vorne, dann mit `current.next` arbeiten und nur ohne Treffer weiterlaufen.',
    m: 'Beim Löschen in einer einfach verketteten Liste braucht man den Vorgänger.', s: 'Folien EProg Kap. 9.3, Folie 31' },

  { id: 'ep9-w3', t: 'ep9', d: 2, k: 'w',
    q: 'Was gibt der Code aus? Zeichne die Liste nach jeder Zeile.',
    code: 'class ListNode {\n    int value;\n    ListNode next;\n    ListNode(int value) { this.value = value; }\n    ListNode(int value, ListNode next) { this(value); this.next = next; }\n}\n\nListNode a = new ListNode(1, new ListNode(2, new ListNode(3, new ListNode(4))));\nListNode b = a.next.next;\na.next.next = b.next;\nb.next = a;\na = b;\nfor (ListNode c = a; c != null; c = c.next) {\n    System.out.print(c.value + " ");\n}',
    out: '3 1 2 4', ans: { k: 'str', v: ['3 1 2 4'], ph: 'Ausgabe' },
    sol: [
      'Start: 1 → 2 → 3 → 4, b zeigt auf Knoten 3.',
      '`a.next.next = b.next`: Knoten 2 zeigt jetzt auf 4. Liste ab a: 1 → 2 → 4.',
      '`b.next = a`: Knoten 3 zeigt auf 1. Ab b: 3 → 1 → 2 → 4.',
      '`a = b`: a zeigt auf Knoten 3.'
    ],
    res: 'Ausgabe: `3 1 2 4` (Knoten 3 wurde an den Anfang verschoben)',
    m: 'Bei Zeigeroperationen jede Zeile einzeln nachzeichnen.', s: 'Folien EProg Kap. 9.1, Folie 8' }
]);

<script>
(function () {
  'use strict';
  var Q = QUIZ.questions, SUBJ = QUIZ.subjects, TOP = QUIZ.topics;
  var SID = SUBJ.map(function (s) { return s.id; });
  var BY_ID = {}, TI = {};
  Q.forEach(function (q) { BY_ID[q.id] = q; });
  SID.forEach(function (f) { TOP[f].forEach(function (t, i) { TI[t.id] = { f: f, i: i, t: t }; }); });
  function subj(f) { for (var i = 0; i < SUBJ.length; i++) if (SUBJ[i].id === f) return SUBJ[i]; }

  // ---------- Speicher ----------
  var KEY = 'basisjahr-quiz-v1';
  var S = {
    tab: 'unterwegs', subj: 'all', diff: 'mix', lim: {}, stoffOpen: true,
    stats: {}, days: {}, recent: { tap: [], write: [] }, review: false
  };
  SID.forEach(function (f) { S.lim[f] = TOP[f].length - 1; });
  try {
    var raw = localStorage.getItem(KEY);
